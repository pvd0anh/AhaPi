<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Không tìm thấy trang · AhaPi</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;800&family=Source+Serif+4:opsz,wght@8..60,400&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;

.hop{text-align:center;max-width:420px}
.dau{width:52px;height:52px;border-radius:12px;background:#5B3FA8;color:#fff;margin:0 auto 22px;
  display:grid;place-items:center;font-family:Georgia,serif;font-size:26px;font-style:italic}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px}
p{font-family:'Source Serif 4',Georgia,serif;font-size:16.5px;line-height:1.7;color:#5C5E63;margin:0 0 24px}
a{display:inline-block;padding:10px 20px;border-radius:8px;background:#5B3FA8;color:#fff;
  text-decoration:none;font-size:14px;font-weight:500}
a:hover{opacity:.9}
</style>
</head>
<body>
<div class="hop">
  <div class="dau">π</div>
  <h1>Không có trang này</h1>
  <p>Đường dẫn bạn mở không tồn tại, hoặc bài giảng đã được đổi tên.</p>
  <a href="./">Về trang bài giảng</a>
</div>
</body>
</html>
