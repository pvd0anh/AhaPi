<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Xưởng Thiết Kế &amp; Khai Triển Mô Hình STEM Từ Bìa Carton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ece6; --surface:#fbfaf6; --surface2:#eff2ec; --ink:#1d2a2a; --muted:#5d6b68; --line:#d3dad2;
  --mat:#2f5d50; --matLine:rgba(255,255,255,.10); --matLine2:rgba(255,255,255,.22);
  --tape:#f2c14e; --tapeInk:#4a3708; --pencil:#3567b5; --cut:#d64b3c;
  --lv1:#d9efd0; --lv1i:#25601a; --lv2:#fbe7b5; --lv2i:#6b4c05; --lv3:#f8d3cd; --lv3i:#8a2418;
  --lvCustom:#d7e7fb; --lvCustomI:#1b4d8c;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a19; --surface:#1d2524; --surface2:#25302e; --ink:#e7eeea; --muted:#9fb0ab; --line:#33403d;
    --mat:#1e3c34; --matLine:rgba(255,255,255,.07); --matLine2:rgba(255,255,255,.14);
    --tape:#e9b93f; --tapeInk:#3a2b05; --pencil:#7aa4ea; --cut:#ef6b5c;
    --lv1:#23401c; --lv1i:#b9e6a8; --lv2:#4a3a10; --lv2i:#f6dc95; --lv3:#4d2420; --lv3i:#f6b9ae;
    --lvCustom:#1d3554; --lvCustomI:#a8ccf8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a19; --surface:#1d2524; --surface2:#25302e; --ink:#e7eeea; --muted:#9fb0ab; --line:#33403d;
  --mat:#1e3c34; --matLine:rgba(255,255,255,.07); --matLine2:rgba(255,255,255,.14);
  --tape:#e9b93f; --tapeInk:#3a2b05; --pencil:#7aa4ea; --cut:#ef6b5c;
  --lv1:#23401c; --lv1i:#b9e6a8; --lv2:#4a3a10; --lv2i:#f6dc95; --lv3:#4d2420; --lv3i:#f6b9ae;
  --lvCustom:#1d3554; --lvCustomI:#a8ccf8;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;line-height:1.15;margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pencil);outline-offset:2px;border-radius:8px}
.wrap{max-width:1260px;margin:0 auto;padding:18px clamp(14px,3vw,32px) 56px}

/* ---------- Top Bar ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand-badge{background:var(--mat);color:#fff;font-family:'Baloo 2',sans-serif;font-weight:800;padding:4px 10px;border-radius:8px;font-size:14px;letter-spacing:.03em;border:1px solid rgba(255,255,255,.2)}
.nav-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink);color:var(--surface);border:0;border-radius:99px;padding:8px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--pencil)}
.btn.tape{background:var(--tape);color:var(--tapeInk)}
.btn.danger{background:var(--cut);color:#fff}
.btn.sm{padding:5px 11px;font-size:13px}

/* ---------- Gallery ---------- */
.hero{display:grid;gap:18px;grid-template-columns:1fr;align-items:end;margin-bottom:22px}
@media(min-width:920px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.hero h1{font-size:clamp(30px,4.5vw,48px);font-weight:800;letter-spacing:-.01em}
.hero p{margin:8px 0 0;color:var(--muted);max-width:62ch}
.tally{display:flex;gap:10px;flex-wrap:wrap}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:120px;flex:1}
.tally b{display:block;font-family:'Baloo 2',sans-serif;font-size:23px;line-height:1.1}
.tally span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0;cursor:pointer;overflow:hidden;transition:transform .18s ease, box-shadow .18s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px -14px rgba(20,40,35,.45)}
.card .tape{position:absolute;top:-6px;left:50%;width:74px;height:22px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);opacity:.88;z-index:2;border-radius:2px}
.card .art{position:relative;background-color:var(--mat);background-image:linear-gradient(var(--matLine) 1px,transparent 1px),linear-gradient(90deg,var(--matLine) 1px,transparent 1px);background-size:16px 16px;aspect-ratio:1/0.92;display:flex;align-items:center;justify-content:center;padding:14px}
.card .art svg{position:absolute;inset:14px;width:calc(100% - 28px);height:calc(100% - 28px)}
.card .body{padding:12px 14px 14px;flex:1;display:flex;flex-direction:column}
.card h2{font-size:21px}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.lv{font-weight:600}
.lv1{background:var(--lv1);color:var(--lv1i)} .lv2{background:var(--lv2);color:var(--lv2i)} .lv3{background:var(--lv3);color:var(--lv3i)} .lvCustom{background:var(--lvCustom);color:var(--lvCustomI)}
.card .sum{margin-top:auto;padding-top:8px;font-size:13.5px;color:var(--muted)}
.card .sum b{color:var(--ink)}
.howto{margin-top:26px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.howto div{border-left:4px solid var(--tape);padding:4px 12px;color:var(--muted);font-size:14px}
.howto b{color:var(--ink)}

/* ---------- Detail ---------- */
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:600}
.back:hover{border-color:var(--pencil)}
.dhead h1{font-size:clamp(26px,4vw,40px);font-weight:800}
.dhead .desc{flex-basis:100%;color:var(--muted);margin:0}
.dgrid{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:960px){.dgrid{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.stage{background-color:var(--mat);background-image:linear-gradient(var(--matLine2) 1px,transparent 1px),linear-gradient(90deg,var(--matLine2) 1px,transparent 1px),linear-gradient(var(--matLine) 1px,transparent 1px),linear-gradient(90deg,var(--matLine) 1px,transparent 1px);background-size:100px 100px,100px 100px,20px 20px,20px 20px;border-radius:8px;padding:10px;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:58vh}
.scene g[data-g]{cursor:pointer}
.scene g.dim{opacity:.28}
.scene g.sel polygon.st{stroke:var(--tape);stroke-width:2.5}
.scene .shadow{fill:rgba(0,0,0,.22)}
.scene .bdg circle{fill:var(--tape);stroke:#3a2b05;stroke-width:1;vector-effect:non-scaling-stroke}
.scene .bdg text{fill:#3a2b05;font-family:'Be Vietnam Pro',sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central}
.scene .bdg.on circle{fill:#fff}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.controls label{font-size:13px;color:var(--muted)}
.controls input[type=range]{flex:1;min-width:140px;accent-color:var(--mat)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:14px}
.stat{background:var(--surface2);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:'Baloo 2',sans-serif;font-size:21px;line-height:1.15}
.stat span{font-size:12.5px;color:var(--muted)}
.panel h2{font-size:22px;margin-bottom:4px}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--surface2)}
tr.row.on td{background:color-mix(in srgb,var(--tape) 30%,transparent)}
.no{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--tape);color:#3a2b05;font-weight:700;font-size:12px;align-items:center;justify-content:center}
tfoot td{font-weight:700;border-bottom:0}
.sh{color:var(--muted);font-size:12.5px}

.ngrid{display:grid;gap:18px;grid-template-columns:1fr;margin-top:18px}
@media(min-width:960px){.ngrid{grid-template-columns:minmax(300px,.82fr) minmax(0,1.18fr)}}
.ptitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ptitle h2{margin:0}
.mini{background:var(--surface2);border-radius:8px;padding:6px;margin:12px 0}
.mini svg{display:block;width:100%;height:auto;max-height:230px}
.mini .dl{fill:var(--ink);font-family:'Be Vietnam Pro',sans-serif;font-weight:600;text-anchor:middle;dominant-baseline:central}
.mini .de{stroke:var(--cut);stroke-width:3;stroke-linecap:round;vector-effect:non-scaling-stroke}
.vars{font-size:13px;color:var(--muted);margin:-4px 0 10px}
.calc{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.calc div{padding:2px 0}
.calc .big{font-size:16px;font-weight:600}
.calc .note{font-size:13px;color:var(--muted)}
.box h3{font-size:18px;margin:16px 0 6px}
.box ul,.box ol{margin:0;padding-left:20px}
.box li{margin:4px 0}
.save{color:#2a7a3a;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .save{color:#8fd49c}}
:root[data-theme="dark"] .save{color:#8fd49c}
.sheet{background:#fdfcf7;border:1px solid #ddd6c4;border-radius:6px;padding:10px;color:#22201b}
.sheet svg{display:block;width:100%;height:auto;max-height:72vh}
.key{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted);margin:10px 0}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:26px;height:12px}
.legend{margin-top:8px}
.legend td{font-size:13.5px;padding:6px 8px}

/* ---------- STEM Studio Builder ---------- */
.form-row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--pencil);border-color:transparent}
.alert{padding:9px 12px;border-radius:8px;font-size:13.5px;margin-top:10px;background:var(--lv2);color:var(--lv2i)}
.alert.err{background:var(--lv3);color:var(--lv3i)}
.alert.ok{background:var(--lv1);color:var(--lv1i)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:var(--surface2);display:flex;flex-direction:column;align-items:center;gap:4px}
.drop:hover,.drop.over{border-color:var(--pencil)}
.drop img{max-width:100%;max-height:220px;border-radius:6px;margin-bottom:6px;background:#fff}
.drop-ico{font-size:30px;line-height:1}
.mode{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.mode h3{font-size:17px;margin-bottom:4px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:2px 0 12px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.color-swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid rgba(128,128,128,.45);cursor:pointer;padding:0}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset;transform:scale(1.12)}
.dacts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ed{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
@media(min-width:1024px){.ed{grid-template-columns:minmax(0,1fr) 350px}}
.ed-pal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pal{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1 1 84px;max-width:140px;min-height:76px;padding:6px 6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);cursor:grab;font-size:12.5px;font-weight:600;line-height:1.2;color:var(--ink)}
.pal:hover{border-color:var(--pencil)}
.pal:active{cursor:grabbing;transform:scale(.97)}
.pal svg{width:48px;height:42px;pointer-events:none}
.ed-stage{position:relative;border-radius:10px;background-color:var(--mat);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ed-stage svg{display:block;width:100%;height:min(64vh,620px);min-height:360px}
.ed-floor{fill:rgba(255,255,255,.07)}
.ed-grid line{stroke:rgba(255,255,255,.12);stroke-width:1;vector-effect:non-scaling-stroke}
.ed-grid line.m{stroke:rgba(255,255,255,.3)}
.ed-grid,.ed-axis,.ed-lab,.ed-foot,.ed-drop{pointer-events:none}
.ed-axis{stroke:var(--tape);stroke-width:1.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke;opacity:.75}
.ed-lab{fill:rgba(255,255,255,.75);font-family:'Be Vietnam Pro',sans-serif;font-weight:700;text-anchor:middle;dominant-baseline:central;letter-spacing:.06em}
.ed-foot{fill:rgba(242,193,78,.26);stroke:var(--tape);stroke-width:1;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.ed-drop{stroke:var(--tape);stroke-width:1;stroke-dasharray:3 3;vector-effect:non-scaling-stroke}
.ed-svg g[data-i]{cursor:grab}
.ed-svg g.bad polygon.st{stroke:#ff6b5b;stroke-width:2.2}
.ed-svg g.sel polygon.st{stroke:var(--tape);stroke-width:2.6}
.hdl{cursor:pointer}
.hdl line{stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.hdl circle{fill:#fff;stroke:var(--pencil);stroke-width:2.5;vector-effect:non-scaling-stroke}
.hdl.lift circle{fill:var(--tape);stroke:#3a2b05}
.hdl.lift line{stroke:var(--tape);stroke-dasharray:3 3;pointer-events:none}
.hdl circle.hit{fill:transparent;stroke:none}
.hdl text{fill:#3a2b05;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.ed-tools{position:absolute;top:8px;left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.ed-tools .grp,.ed-sel{display:flex;align-items:center;gap:2px;background:rgba(10,20,18,.55);border-radius:10px;padding:3px;pointer-events:auto}
.ib{min-width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:18px;cursor:pointer;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:600}
.ib small{font-size:12.5px}
.ib:hover{background:rgba(255,255,255,.15)}
.ib[aria-pressed="true"]{background:var(--tape);color:var(--tapeInk)}
.ib:disabled{opacity:.35;cursor:default;background:transparent}
.ib.del:hover{background:var(--cut)}
.vw{color:rgba(255,255,255,.85);font-size:12px;padding:0 4px;white-space:nowrap}
.ed-sel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}
.ed-sel[hidden],.ed-live[hidden],.ed-empty[hidden]{display:none}
.ed-live{position:absolute;top:58px;left:50%;transform:translateX(-50%);background:rgba(10,20,18,.7);color:#fff;font-size:13px;font-weight:600;padding:4px 12px;border-radius:99px;pointer-events:none;white-space:nowrap;width:max-content}
.ed-empty{position:absolute;left:0;right:0;top:42%;text-align:center;color:rgba(255,255,255,.88);font-weight:600;pointer-events:none;padding:0 20px;line-height:1.5}
.ed-toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);background:var(--surface);color:var(--ink);font-size:13.5px;padding:7px 14px;border-radius:8px;box-shadow:0 8px 22px -10px rgba(0,0,0,.55);opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.ed-toast.on{opacity:1}
@media(max-width:640px){.ed-sel small,.vw{display:none}.ib{min-width:38px;height:38px;padding:0 6px}}
.ed-side{display:flex;flex-direction:column;gap:12px}
.ed-side .panel{padding:14px}
.sth{font-size:18px;display:flex;align-items:center;gap:8px;margin:0}
.ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ph .sth{margin-right:auto}
.dot{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.txt{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:14px;width:100%}
textarea.txt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;margin:8px 0;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>label{font-size:12px;font-weight:600;color:var(--muted)}
.fld.cols{margin-top:6px}
.stp{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);height:36px}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;padding:0 2px;font-size:14px;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sb{border:0;background:transparent;width:30px;font-size:18px;cursor:pointer;color:var(--ink);flex:none}
.sb:hover{background:var(--line)}
.ro{height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.seg{display:flex;gap:4px}
.seg button{flex:1;border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:6px 4px;cursor:pointer;font-size:13px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--mat);color:#fff;border-color:var(--mat)}
details.pos{margin:4px 0}
details.pos summary,details.more summary{cursor:pointer;font-weight:700}
details.pos summary{font-size:13.5px;color:var(--muted)}
details.more+details.more{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
details.more summary{font-family:'Baloo 2',sans-serif;font-size:17px}
details.more[open] summary{margin-bottom:8px}
.brow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.plist{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.prow{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid transparent;background:var(--surface2);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:13.5px;width:100%;color:var(--ink)}
.prow i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);flex:none}
.prow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow small{margin-left:auto;color:var(--muted);white-space:nowrap;font-size:12px}
.prow.on{border-color:var(--tape);background:color-mix(in srgb,var(--tape) 22%,var(--surface2))}
.prow.bad b{color:var(--cut)}
.tips{margin:6px 0 8px;padding-left:18px;font-size:13.5px;color:var(--muted)}

let R3=[Math.cos(PSI),-Math.sin(PSI),0];

let D3=[Math.sin(PSI)*Math.cos(PHI),Math.cos(PSI)*Math.cos(PHI),Math.sin(PHI)];

/* sRGB → CIELAB: khoảng cách Lab gần với cảm nhận của mắt (khoảng cách RGB biến xám đậm thành nâu, xanh rêu) */
function rgb2lab(c){
  const l=c.map(v=>{v/=255;return v>0.04045?((v+0.055)/1.055)**2.4:v/12.92;});
  const [x,y,z]=[(l[0]*.4124+l[1]*.3576+l[2]*.1805)/.95047,l[0]*.2126+l[1]*.7152+l[2]*.0722,(l[0]*.0193+l[1]*.1192+l[2]*.9505)/1.08883]
    .map(t=>t>0.008856?Math.cbrt(t):7.787*t+16/116);
  return [116*y-16,500*(x-y),200*(y-z)];
}
function rgb2hex(c){return '#'+c.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
const shade=(h,f)=>rgb2hex(hex2rgb(h).map(v=>v*f));

function P(g,axis,tri,o,len,color,opt={}){return {uid:UID++,g,type:'prism',axis,tri,o,len,color,cap:opt.cap||color,dec:opt.dec||[],before:[]};}

function serializePart(p){
  if(p.type==='box'){const o={type:'box',g:p.g,o:p.o,s:p.s,color:p.color,dec:p.dec||[]};if(p.before&&p.before.length)o.before=p.before;return o;}

  return {type:'pyr',g:p.g,cx:p.cx,cy:p.cy,z0:p.z0,a:p.a,d:p.d,color:p.color,flag:!!(p.dec&&p.dec.length)};
}
function hydratePart(raw){
  if(raw.type==='prism')return P(raw.g||'Lăng trụ',raw.axis||'y',raw.tri||[[0,0],[3,0],[0,4]],raw.o||[0,0,0],Number(raw.len)||4,raw.color||C.yellow,{cap:raw.cap||raw.color,dec:raw.dec||[]});
  if(raw.type==='pyr')return Y(raw.g||'Mái chóp',Number(raw.cx)||0,Number(raw.cy)||0,Number(raw.z0)||0,Number(raw.a)||6,Number(raw.d)||5,raw.color||C.red,!!raw.flag);
  const o=raw.o||[0,0,0],s=raw.s||[4,4,4];
  return B(raw.g||'Khối hộp',Number(o[0])||0,Number(o[1])||0,Number(o[2])||0,Math.max(.5,Number(s[0])||4),Math.max(.5,Number(s[1])||4),Math.max(.5,Number(s[2])||4),raw.color||C.blue,{dec:raw.dec||[],before:raw.before||[]});
}
function readRaw(){
  try{const s=localStorage.getItem(STORAGE_KEY);if(s)return JSON.parse(s);}catch(e){}
  return CUSTOM_MEM;
}
function loadCustomModels(){
  try{
    const raw=readRaw();
    if(!Array.isArray(raw))return [];
    return raw.map(m=>({
      slug:m.slug,
      name:m.name||'Mô hình tự tạo',
      level:m.level||0,
      custom:true,
      desc:m.desc||'Mô hình STEM do học sinh tự thiết kế và khai triển.',
      parts:(m.parts||[]).map(hydratePart)
    })).filter(m=>m.parts.length>0);
  }catch(e){return [];}
}
function saveCustomModels(list){
  const payload=list.map(m=>({
    slug:m.slug,name:m.name,level:0,desc:m.desc,
    parts:m.parts.map(serializePart)
  }));
  CUSTOM_MEM=payload;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload));}catch(e){}
}
function rebuildAllModels(){
  const custom=loadCustomModels();
  MODELS=[...BUILTIN_MODELS,...custom];
  MODELS.forEach(M=>{
    prepare(M);
    M.cardSVG=sceneSVG(M,0,{small:true});
  });
}

/* =================== Tính hình học từng khối =================== */
function geom(p){
  let verts,faces;
  if(p.type==='box'){
    const [x,y,z]=p.o,[a,b,h]=p.s,X=x+a,Yy=y+b,Z=z+h;
    verts=[[x,y,z],[X,Yy,Z]];
    faces=[
      {k:'+z',pts:[[x,y,Z],[X,y,Z],[X,Yy,Z],[x,Yy,Z]],n:[0,0,1]},
      {k:'-z',pts:[[x,y,z],[x,Yy,z],[X,Yy,z],[X,y,z]],n:[0,0,-1]},
      {k:'+y',pts:[[x,Yy,z],[X,Yy,z],[X,Yy,Z],[x,Yy,Z]],n:[0,1,0]},
      {k:'-y',pts:[[x,y,z],[x,y,Z],[X,y,Z],[X,y,z]],n:[0,-1,0]},
      {k:'+x',pts:[[X,y,z],[X,y,Z],[X,Yy,Z],[X,Yy,z]],n:[1,0,0]},
      {k:'-x',pts:[[x,y,z],[x,Yy,z],[x,Yy,Z],[x,y,Z]],n:[-1,0,0]}];
    faces.forEach(f=>f.color=p.color);
  }else if(p.type==='prism'){
    const {axis,tri,o,len}=p;
    const mp=(u,v,w)=>axis==='y'?[o[0]+u,o[1]+w,o[2]+v]:[o[0]+w,o[1]+u,o[2]+v];
    const c0=tri.map(([u,v])=>mp(u,v,0)),c1=tri.map(([u,v])=>mp(u,v,len));
    verts=c0.concat(c1);
    faces=[{pts:c0,color:p.cap},{pts:c1,color:p.cap}];
    for(let i=0;i<3;i++){const j=(i+1)%3;faces.push({pts:[c0[i],c0[j],c1[j],c1[i]],color:p.color});}
  }else{
    const {cx,cy,z0,a,H}=p,h2=a/2;
    const bs=[[cx-h2,cy-h2,z0],[cx+h2,cy-h2,z0],[cx+h2,cy+h2,z0],[cx-h2,cy+h2,z0]],ap=[cx,cy,z0+H];
    verts=bs.concat([ap]);
    faces=[{pts:bs,color:p.color}];
    for(let i=0;i<4;i++)faces.push({pts:[bs[i],bs[(i+1)%4],ap],color:p.color});
  }
  const cv=[0,1,2].map(i=>verts.reduce((s,q)=>s+q[i],0)/verts.length);
  faces.forEach(f=>{
    if(!f.n){
      let n=norm(cross(sub(f.pts[1],f.pts[0]),sub(f.pts[2],f.pts[0])));
      const fc=[0,1,2].map(i=>f.pts.reduce((s,q)=>s+q[i],0)/f.pts.length);
      if(dot(n,sub(fc,cv))<0)n=n.map(v=>-v);
      f.n=n;
    }
  });
  const all=faces.flatMap(f=>f.pts);
  p.min=[0,1,2].map(i=>Math.min(...all.map(q=>q[i])));
  p.max=[0,1,2].map(i=>Math.max(...all.map(q=>q[i])));
  p.cen=p.min.map((v,i)=>(v+p.max[i])/2);
  p.faces=faces;
}
const d2=(A,B)=>Math.hypot(B[0]-A[0],B[1]-A[1]);
function info(p){
  if(p.type==='box'){const [a,b,h]=p.s;return {S:2*(a*b+b*h+a*h)};}
  if(p.type==='prism'){
    const [A,Bp,Cp]=p.tri;const l=[d2(A,Bp),d2(Bp,Cp),d2(Cp,A)].map(r2);
    const hC=Math.abs(Cp[1]-A[1]);const per=l[0]+l[1]+l[2],Sd=.5*l[0]*hC,Sxq=per*p.len;
    return {l,hC,per,Sd,Sxq,S:Sxq+2*Sd};
  }
  const pp=2*p.a;return {p:pp,S:pp*p.d,e:Math.hypot(p.d,p.a/2)};
}
const isCube=p=>p.type==='box'&&p.s[0]===p.s[1]&&p.s[1]===p.s[2];
function shapeName(p){
  if(p.type==='box')return isCube(p)?'Hình lập phương':'Hình hộp chữ nhật';
  if(p.type==='prism')return 'Lăng trụ đứng tam giác';
  return 'Hình chóp tứ giác đều';
}
function dimText(p){
  if(p.type==='box'){const [a,b,h]=p.s;return isCube(p)?`cạnh ${fmt(a)}`:`${fmt(a)} × ${fmt(b)} × ${fmt(h)}`;}
  if(p.type==='prism'){const I=info(p);return `∆ ${I.l.slice().sort((x,y)=>x-y).map(fmt).join('–')}, dài ${fmt(p.len)}`;}
  return `đáy ${fmt(p.a)}, trung đoạn ${fmt(p.d)}`;
}

/* =================== Phát hiện tiếp xúc & Chuẩn bị mô hình =================== */
const EXP=0.9;
const FACE_NAME={'+z':'mặt trên','-z':'mặt dưới','+y':'mặt trước','-y':'mặt sau','+x':'mặt phải','-x':'mặt trái'};
function faceArea(p,f){const k='xyz'.indexOf(f[1]);const o=[0,1,2].filter(i=>i!==k);return (p.max[o[0]]-p.min[o[0]])*(p.max[o[1]]-p.min[o[1]]);}
function canOmit(p,f){return p.type==='box'||(p.type==='prism'&&f==='-z');}
function contacts(M){
  const S=M.parts;S.forEach(p=>p.cont=[]);
  for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){
    for(let k=0;k<3;k++){
      for(const [Pp,Q] of [[S[i],S[j]],[S[j],S[i]]]){
        if(Math.abs(Pp.max[k]-Q.min[k])>1e-6)continue;
        const o=[0,1,2].filter(t=>t!==k);
        let ov=1;for(const t of o)ov*=Math.max(0,Math.min(Pp.max[t],Q.max[t])-Math.max(Pp.min[t],Q.min[t]));
        if(ov<1e-6)continue;
        const fp='+'+'xyz'[k],fq='-'+'xyz'[k];
        const aP=faceArea(Pp,fp),aQ=faceArea(Q,fq);
        let fullP=canOmit(Pp,fp)&&ov>=aP-1e-6,fullQ=canOmit(Q,fq)&&ov>=aQ-1e-6;
        if(fullP&&fullQ)fullP=false;
        Pp.cont.push({face:fp,other:Q,area:ov,full:fullP,faceArea:aP});
        Q.cont.push({face:fq,other:Pp,area:ov,full:fullQ,faceArea:aQ});
      }
    }
  }
}
function prepare(M){
  const sigs=new Map();
  M.parts.forEach(p=>{
    const base=p.baseG||p.g;p.baseG=base;
    const sig=shapeName(p)+'|'+r2(info(p).S);
    if(!sigs.has(base))sigs.set(base,[]);
    const L=sigs.get(base);let k=L.indexOf(sig);if(k<0){L.push(sig);k=L.length-1;}
    p.g=k?`${base} (${k+1})`:base;
  });
  M.all=[];M.byUid={};
  M.parts.forEach(p=>{
    geom(p);M.all.push(p);M.byUid[p.uid]=p;
    (p.dec||[]).forEach(d=>{const q={uid:UID++,type:'box',decor:true,parent:p.uid,g:p.g,o:[d[0],d[1],d[2]],s:[d[3],d[4],d[5]],color:d[6],before:[]};geom(q);M.all.push(q);M.byUid[q.uid]=q;});
  });
  const mn=[0,1,2].map(i=>Math.min(...M.parts.map(p=>p.min[i]))),mx=[0,1,2].map(i=>Math.max(...M.parts.map(p=>p.max[i])));
  M.lo=mn;M.hi=mx;M.center=mn.map((v,i)=>(v+mx[i])/2);
  const gm=new Map();
  M.parts.forEach(p=>{if(!gm.has(p.g))gm.set(p.g,{g:p.g,items:[]});gm.get(p.g).items.push(p);});
  const vol=p=>(p.max[0]-p.min[0])*(p.max[1]-p.min[1])*(p.max[2]-p.min[2]);
  M.groups=[...gm.values()].sort((a,b)=>(b.items[0].max[2]-a.items[0].max[2])||(vol(b.items[0])-vol(a.items[0])));
  contacts(M);
  M.groups.forEach((G,i)=>{G.idx=i+1;G.p=G.items[0];G.n=G.items.length;G.S=info(G.p).S;G.total=G.S*G.n;
    G.save=G.items.reduce((s,p)=>s+p.cont.filter(c=>c.full).reduce((t,c)=>t+c.faceArea,0),0);});
  M.S=M.groups.reduce((s,G)=>s+G.total,0);
  M.save=M.groups.reduce((s,G)=>s+G.save,0);
  M.types=[...new Set(M.parts.map(shapeName))];
  M.b0=boundsOf(sceneItems(M,0),0.05);
  M.b1=unionB(M.b0,boundsOf(sceneItems(M,1),0.05));
}

/* =================== Vẽ cảnh 3D SVG =================== */
function sceneItems(M,e){
  const k=e*EXP;
  return M.all.map(p=>{
    const base=p.decor?M.byUid[p.parent]:p;
    const off=[0,1,2].map(i=>(base.cen[i]-M.center[i])*k);
    const min=p.min.map((v,i)=>v+off[i]),max=p.max.map((v,i)=>v+off[i]);
    const sb=[Infinity,Infinity,-Infinity,-Infinity];
    const faces=p.faces.map(f=>{
      const pts2=f.pts.map(q=>proj([q[0]+off[0],q[1]+off[1],q[2]+off[2]]));
      pts2.forEach(([x,y])=>{if(x<sb[0])sb[0]=x;if(y<sb[1])sb[1]=y;if(x>sb[2])sb[2]=x;if(y>sb[3])sb[3]=y;});
      return {f,pts2};
    });
    const c=min.map((v,i)=>(v+max[i])/2);
    return {p,g:p.g,before:p.before||[],min,max,sb,faces,depth:dot(c,D3),off};
  });
}
function boundsOf(items,padF){
  const sb=[Infinity,Infinity,-Infinity,-Infinity];
  items.forEach(it=>{sb[0]=Math.min(sb[0],it.sb[0]);sb[1]=Math.min(sb[1],it.sb[1]);sb[2]=Math.max(sb[2],it.sb[2]);sb[3]=Math.max(sb[3],it.sb[3]);});
  const w=sb[2]-sb[0],h=sb[3]-sb[1],pad=Math.max(w,h,2)*padF;
  return {x:sb[0]-pad,y:sb[1]-pad,w:w+2*pad,h:h+2*pad};
}
function unionB(a,b){const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y);return {x,y,w:Math.max(a.x+a.w,b.x+b.w)-x,h:Math.max(a.y+a.h,b.y+b.h)-y};}
function drawOrder(items){
  const n=items.length,adj=Array.from({length:n},()=>[]),indeg=new Array(n).fill(0);
  const ov2=(a,b)=>a.sb[0]<b.sb[2]-1e-6&&b.sb[0]<a.sb[2]-1e-6&&a.sb[1]<b.sb[3]-1e-6&&b.sb[1]<a.sb[3]-1e-6;
  const sep=(a,b)=>{for(let k=0;k<3;k++)if(D3[k]>=0?a.max[k]<=b.min[k]+1e-6:b.max[k]<=a.min[k]+1e-6)return true;return false;}; // a nằm sau b theo hướng nhìn
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){
    const I=items[i],J=items[j];let e=0;
    if(!I.p.decor&&!J.p.decor&&I.before.includes(J.g))e=1;
    else if(!I.p.decor&&!J.p.decor&&J.before.includes(I.g))e=-1;
    else if(ov2(I,J)){const a=sep(I,J),b=sep(J,I);if(a&&!b)e=1;else if(b&&!a)e=-1;}
    if(e===1){adj[i].push(j);indeg[j]++;}else if(e===-1){adj[j].push(i);indeg[i]++;}
  }
  const done=new Array(n).fill(false),out=[];
  for(let s=0;s<n;s++){
    let best=-1;
    for(let i=0;i<n;i++)if(!done[i]&&indeg[i]===0&&(best<0||items[i].depth<items[best].depth))best=i;
    if(best<0)for(let i=0;i<n;i++)if(!done[i]&&(best<0||items[i].depth<items[best].depth))best=i;
    done[best]=true;out.push(items[best]);adj[best].forEach(j=>indeg[j]--);
  }
  return out;
}
function sceneSVG(M,e,opt={}){
  const items=sceneItems(M,e),ord=drawOrder(items);
  const b=opt.bounds||M.b0,sw=opt.small?0.9:1.1;
  let s=`<svg class="scene" viewBox="${f2(b.x)} ${f2(b.y)} ${f2(b.w)} ${f2(b.h)}" role="img" aria-label="Mô hình ${M.name}">`;
  const cs=[[M.lo[0],M.lo[1]],[M.hi[0],M.lo[1]],[M.hi[0],M.hi[1]],[M.lo[0],M.hi[1]]].map(([x,y])=>proj([x,y,M.lo[2]]));
  const xs=cs.map(c=>c[0]),ys=cs.map(c=>c[1]);
  s+=`<ellipse class="shadow" cx="${f2((Math.min(...xs)+Math.max(...xs))/2)}" cy="${f2((Math.min(...ys)+Math.max(...ys))/2)}" rx="${f2((Math.max(...xs)-Math.min(...xs))*.5)}" ry="${f2((Math.max(...ys)-Math.min(...ys))*.5)}"/>`;
  for(const it of ord){
    const cls=opt.sel?(it.g===opt.sel?'sel':'dim'):'';
    s+=`<g data-g="${it.g}" class="${cls}">`;
    for(const F of it.faces){
      if(dot(F.f.n,D3)<=1e-6)continue;
      const fill=shade(F.f.color,0.58+0.42*Math.max(0,dot(F.f.n,LIGHT)));
      const pts=F.pts2.map(q=>f2(q[0])+','+f2(q[1])).join(' ');
      if(it.p.decor)s+=`<polygon points="${pts}" fill="${fill}" stroke="${shade(F.f.color,.75)}" stroke-width=".5" vector-effect="non-scaling-stroke"/>`;
      else s+=`<polygon class="st" points="${pts}" fill="${fill}" stroke="#4a301c" stroke-width="${sw}" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    }
    s+='</g>';
  }
  if(opt.badges){
    const r=b.w*0.024;
    M.groups.forEach(G=>{
      const it=items.find(i=>i.p===G.p);
      const c=proj([G.p.cen[0]+it.off[0],G.p.cen[1]+it.off[1],G.p.cen[2]+it.off[2]]);
      s+=`<g class="bdg${(opt.on||opt.sel)===G.g?' on':''}" data-g="${G.g}"><circle cx="${f2(c[0])}" cy="${f2(c[1])}" r="${f2(r)}"/><text x="${f2(c[0])}" y="${f2(c[1])}" font-size="${f2(r*1.15)}">${G.idx}</text></g>`;
    });
  }
  return s+'</svg>';
}

/* =================== Hình 3D riêng một khối, có kích thước =================== */
function partSVG(p){
  const faces=p.faces.filter(f=>dot(f.n,D3)>1e-6).map(f=>({f,pts2:f.pts.map(proj)}));
  const [x0,y0,z0]=p.min,[X,Yy,Z]=p.max;
  let dims=[{a:[x0,Yy,z0],b:[X,Yy,z0],v:X-x0},{a:[X,y0,z0],b:[X,Yy,z0],v:Yy-y0},{a:[X,Yy,z0],b:[X,Yy,Z],v:Z-z0}];
  let lab;
  if(p.type==='box')lab=['a','b','h'];
  else if(p.type==='prism')lab=p.axis==='y'?['đáy','dài','cao']:['dài','đáy','cao'];
  else{lab=['đáy','đáy'];dims=dims.slice(0,2);}
  const all=faces.flatMap(F=>F.pts2);
  const xs=all.map(q=>q[0]),ys=all.map(q=>q[1]);
  const mnx=Math.min(...xs),mxx=Math.max(...xs),mny=Math.min(...ys),mxy=Math.max(...ys);
  const M=Math.max(mxx-mnx,mxy-mny,1),pad=M*.34;
  let s=`<svg viewBox="${f2(mnx-pad)} ${f2(mny-pad*.8)} ${f2(mxx-mnx+2*pad)} ${f2(mxy-mny+1.6*pad)}" role="img" aria-label="Khối và kích thước">`;
  faces.forEach(F=>{
    const fill=shade(F.f.color,0.58+0.42*Math.max(0,dot(F.f.n,LIGHT)));
    s+=`<polygon points="${F.pts2.map(q=>f2(q[0])+','+f2(q[1])).join(' ')}" fill="${fill}" stroke="#4a301c" stroke-width="1.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  });
  dims.forEach((d,i)=>{
    const A=proj(d.a),Bq=proj(d.b),m=[(A[0]+Bq[0])/2,(A[1]+Bq[1])/2];
    const dirs=[[-0.45,0.9],[0.75,0.7],[1,0]],dir=dirs[i],k=i===2?.24:.15;
    const pos=[m[0]+dir[0]*M*k,m[1]+dir[1]*M*k];
    s+=`<line class="de" x1="${f2(A[0])}" y1="${f2(A[1])}" x2="${f2(Bq[0])}" y2="${f2(Bq[1])}"/>`;
    s+=`<text class="dl" x="${f2(pos[0])}" y="${f2(pos[1])}" font-size="${f2(M*.085)}">${lab[i]} = ${fmt(d.v)}</text>`;
  });
  return s+'</svg>';
}

/* =================== Trình tạo Lưới khai triển (2D Net) =================== */
const rect=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];
function polyArea(pts){let s=0;for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}
function netOf(p,covered){
  if(p.type==='box'){
    const [a,b,h]=p.s,t=Math.min(1,Math.max(.4,Math.min(a,b,h)*.5));
    const faces=[
      {k:'-x',name:'Trái',dims:`${fmt(b)} × ${fmt(h)}`,pts:rect(0,b,b,h)},
      {k:'+y',name:'Trước',dims:`${fmt(a)} × ${fmt(h)}`,pts:rect(b,b,a,h)},
      {k:'+x',name:'Phải',dims:`${fmt(b)} × ${fmt(h)}`,pts:rect(b+a,b,b,h)},
      {k:'-y',name:'Sau',dims:`${fmt(a)} × ${fmt(h)}`,pts:rect(2*b+a,b,a,h)},
      {k:'+z',name:'Trên',dims:`${fmt(a)} × ${fmt(b)}`,pts:rect(b,0,a,b)},
      {k:'-z',name:'Dưới',dims:`${fmt(a)} × ${fmt(b)}`,pts:rect(b,b+h,a,b)}];
    const W=2*a+2*b;
    const tabs=[[[W,b],[W,b+h]],[[0,b],[b,b]],[[0,b+h],[b,b+h]],[[b+a,b],[2*b+a,b]],[[b+a,b+h],[2*b+a,b+h]],[[2*b+a,b],[W,b]],[[2*b+a,b+h],[W,b+h]]];
    faces.forEach(f=>{f.covered=covered.has(f.k);f.color=p.color;});
    return {faces,tabs,t};
  }
  if(p.type==='prism'){
    const I=info(p),[l0,l1,l2]=I.l,L=p.len,[A,Bp,Cp]=p.tri;
    const t=Math.min(1,Math.max(.4,Math.min(L,l0,l1,l2)*.5));
    const cx=((Cp[0]-A[0])*(Bp[0]-A[0])+(Cp[1]-A[1])*(Bp[1]-A[1]))/l0,cy=I.hC;
    const T=l0+l1+l2;
    const faces=[
      {k:'-z',name:'Bên 1',dims:`${fmt(l0)} × ${fmt(L)}`,pts:rect(0,0,l0,L)},
      {name:'Bên 2',dims:`${fmt(l1)} × ${fmt(L)}`,pts:rect(l0,0,l1,L)},
      {name:'Bên 3',dims:`${fmt(l2)} × ${fmt(L)}`,pts:rect(l0+l1,0,l2,L)},
      {name:'Đáy 1',dims:`đáy ${fmt(l0)}, cao ${fmt(cy)}`,pts:[[0,0],[l0,0],[cx,-cy]]},
      {name:'Đáy 2',dims:`đáy ${fmt(l0)}, cao ${fmt(cy)}`,pts:[[0,L],[l0,L],[cx,L+cy]]}];
    const tabs=[[[T,0],[T,L]],[[l0,0],[l0+l1,0]],[[l0,L],[l0+l1,L]],[[l0+l1,0],[T,0]],[[l0+l1,L],[T,L]]];
    faces.forEach((f,i)=>{f.covered=!!f.k&&covered.has(f.k);f.color=i<3?p.color:p.cap;});
    return {faces,tabs,t};
  }
  const I=info(p),e=I.e,al=Math.atan2(p.a/2,p.d),th0=Math.PI/2-4*al;
  const Pt=i=>[e*Math.cos(th0+2*al*i),e*Math.sin(th0+2*al*i)];
  const faces=[0,1,2,3].map(i=>({name:'Bên '+(i+1),dims:`đáy ${fmt(p.a)}, trung đoạn ${fmt(p.d)}`,pts:[[0,0],Pt(i),Pt(i+1)],color:p.color}));
  return {faces,tabs:[[[0,0],Pt(4)]],t:Math.min(1,p.a*.2)};
}
function netSVG(net){
  const {faces,tabs,t}=net;
  const key=(P,Q)=>{const a=P.map(v=>v.toFixed(3)).join(','),b=Q.map(v=>v.toFixed(3)).join(',');return a<b?a+'|'+b:b+'|'+a;};
  const segs=new Map();
  faces.forEach((f,fi)=>{const n=f.pts.length;for(let i=0;i<n;i++){const P=f.pts[i],Q=f.pts[(i+1)%n],k=key(P,Q);if(!segs.has(k))segs.set(k,{P,Q,o:[]});segs.get(k).o.push(fi);}});
  const tabSet=new Set(),tabPolys=[];
  tabs.forEach(([P,Q])=>{
    const k=key(P,Q),sg=segs.get(k);if(!sg)return;tabSet.add(k);
    const f=faces[sg.o[0]],c=[f.pts.reduce((s,q)=>s+q[0],0)/f.pts.length,f.pts.reduce((s,q)=>s+q[1],0)/f.pts.length];
    const L=Math.hypot(Q[0]-P[0],Q[1]-P[1]),u=[(Q[0]-P[0])/L,(Q[1]-P[1])/L];let n=[-u[1],u[0]];
    const m=[(P[0]+Q[0])/2,(P[1]+Q[1])/2];if((m[0]-c[0])*n[0]+(m[1]-c[1])*n[1]<0)n=[-n[0],-n[1]];
    const ins=Math.min(t*.9,L*.3);
    tabPolys.push([P,Q,[Q[0]+n[0]*t-u[0]*ins,Q[1]+n[1]*t-u[1]*ins],[P[0]+n[0]*t+u[0]*ins,P[1]+n[1]*t+u[1]*ins]]);
  });
  const all=faces.flatMap(f=>f.pts).concat(tabPolys.flat());
  const mnx=Math.min(...all.map(q=>q[0])),mxx=Math.max(...all.map(q=>q[0])),mny=Math.min(...all.map(q=>q[1])),mxy=Math.max(...all.map(q=>q[1]));
  const W=mxx-mnx,H=mxy-mny,Mx=Math.max(W,H),pad=Math.max(1,Mx*.07),fs=(Mx+2*pad)*.03;
  const gx=Math.floor(mnx-pad),gy=Math.floor(mny-pad),gw=Math.ceil(mxx+pad)-gx,gh=Math.ceil(mxy+pad)-gy;
  const hs=(Mx+2*pad)*.018,da=(Mx+2*pad)*.012;
  let s=`<svg viewBox="${f2(gx)} ${f2(gy)} ${gw} ${gh}" role="img" aria-label="Lưới khai triển">
  <defs>
   <pattern id="g1" x="0" y="0" width="1" height="1" patternUnits="userSpaceOnUse"><path d="M1 0H0V1" fill="none" stroke="#d9e3ea" stroke-width=".6" vector-effect="non-scaling-stroke"/></pattern>
   <pattern id="g5" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="url(#g1)"/><path d="M5 0H0V5" fill="none" stroke="#b9c9d6" stroke-width=".9" vector-effect="non-scaling-stroke"/></pattern>
   <pattern id="hat" width="${f2(hs)}" height="${f2(hs)}" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="${f2(hs)}" stroke="#8a7f70" stroke-width="1" vector-effect="non-scaling-stroke"/></pattern>
  </defs>
  <rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" fill="url(#g5)"/>`;
  tabPolys.forEach(q=>{s+=`<polygon points="${q.map(v=>f2(v[0])+','+f2(v[1])).join(' ')}" fill="#d8d2c8"/>`;});
  faces.forEach(f=>{
    const pts=f.pts.map(v=>f2(v[0])+','+f2(v[1])).join(' ');
    s+=`<polygon points="${pts}" fill="${mix(f.color,'#ffffff',.55)}"/>`;
    if(f.covered)s+=`<polygon points="${pts}" fill="url(#hat)"/>`;
  });
  segs.forEach((sg,k)=>{
    const fold=sg.o.length>1||tabSet.has(k);
    s+=`<line x1="${f2(sg.P[0])}" y1="${f2(sg.P[1])}" x2="${f2(sg.Q[0])}" y2="${f2(sg.Q[1])}" stroke="${fold?'#3567b5':'#22201b'}" stroke-width="${fold?1.3:1.8}" ${fold?`stroke-dasharray="${f2(da)} ${f2(da*.7)}"`:''} vector-effect="non-scaling-stroke" stroke-linecap="round"/>`;
  });
  tabPolys.forEach(q=>{s+=`<polyline points="${[q[1],q[2],q[3],q[0]].map(v=>f2(v[0])+','+f2(v[1])).join(' ')}" fill="none" stroke="#22201b" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;});
  faces.forEach(f=>{
    const xs=f.pts.map(q=>q[0]),ys=f.pts.map(q=>q[1]);
    const w=Math.max(...xs)-Math.min(...xs),h=Math.max(...ys)-Math.min(...ys);
    const c=[xs.reduce((a,b)=>a+b,0)/xs.length,ys.reduce((a,b)=>a+b,0)/ys.length];
    const nameW=f.name.length*fs*.6,dimW=f.dims.length*fs*.5;
    if(w>Math.max(nameW,dimW)*1.05&&h>fs*2.6){
      s+=`<text x="${f2(c[0])}" y="${f2(c[1]-fs*.55)}" font-size="${f2(fs)}" text-anchor="middle" font-weight="700" fill="#22201b" font-family="Be Vietnam Pro,sans-serif">${f.name}</text>`;
      s+=`<text x="${f2(c[0])}" y="${f2(c[1]+fs*.75)}" font-size="${f2(fs*.82)}" text-anchor="middle" fill="#4b463e" font-family="Be Vietnam Pro,sans-serif">${f.dims}</text>`;
    }else if(w>nameW*1.05&&h>fs*1.3){
      s+=`<text x="${f2(c[0])}" y="${f2(c[1])}" font-size="${f2(fs)}" text-anchor="middle" dominant-baseline="central" font-weight="700" fill="#22201b" font-family="Be Vietnam Pro,sans-serif">${f.name}</text>`;
    }
  });
  s+=`<g font-family="Be Vietnam Pro,sans-serif" font-size="${f2(fs*.8)}" fill="#5b5448"><line x1="${gx+.5}" y1="${f2(gy+gh-.6)}" x2="${gx+1.5}" y2="${f2(gy+gh-.6)}" stroke="#22201b" stroke-width="2" vector-effect="non-scaling-stroke"/><text x="${f2(gx+1.8)}" y="${f2(gy+gh-.6)}" dominant-baseline="central">1 ô = 1 cm</text></g>`;
  return {svg:s+'</svg>',W,H};
}

/* =================== Nội dung giải thích toán học & lắp ráp =================== */
function calcHTML(G){
  const p=G.p,I=info(p);let h='';
  if(p.type==='box'){
    const [a,b,hh]=p.s;
    if(isCube(p))h+=`<div class="big">S<sub>tp</sub> = 6a²</div><div>= 6 · ${fmt(a)}² = 6 · ${fmt(a*a)} = <b>${fmt(I.S)} cm²</b></div>`;
    else h+=`<div class="big">S<sub>tp</sub> = 2(a·b + b·h + a·h)</div><div>= 2(${fmt(a)}·${fmt(b)} + ${fmt(b)}·${fmt(hh)} + ${fmt(a)}·${fmt(hh)})</div><div>= 2 · ${fmt(a*b+b*hh+a*hh)} = <b>${fmt(I.S)} cm²</b></div>`;
  }else if(p.type==='prism'){
    h+=`<div class="big">S<sub>tp</sub> = S<sub>xq</sub> + 2S<sub>đáy</sub></div>
      <div>C<sub>đáy</sub> = ${I.l.map(fmt).join(' + ')} = ${fmt(I.per)} cm</div>
      <div>S<sub>xq</sub> = C<sub>đáy</sub> · h = ${fmt(I.per)} · ${fmt(p.len)} = ${fmt(I.Sxq)} cm²</div>
      <div>S<sub>đáy</sub> = ½ · ${fmt(I.l[0])} · ${fmt(I.hC)} = ${fmt(I.Sd)} cm²</div>
      <div>S<sub>tp</sub> = ${fmt(I.Sxq)} + 2 · ${fmt(I.Sd)} = <b>${fmt(I.S)} cm²</b></div>`;
  }else{
    h+=`<div class="big">S<sub>xq</sub> = p · d</div>
      <div>p = 4 · ${fmt(p.a)} : 2 = ${fmt(I.p)} cm (nửa chu vi đáy)</div>
      <div>S<sub>xq</sub> = ${fmt(I.p)} · ${fmt(p.d)} = <b>${fmt(I.S)} cm²</b></div>
      <div class="note">Mở rộng Toán 8. Mái không cần mặt đáy nên chỉ tính S<sub>xq</sub>.</div>`;
  }
  if(G.n>1)h+=`<div>× ${G.n} chiếc = <b>${fmt(G.total)} cm²</b></div>`;
  return h;
}
function varsText(p){
  if(p.type==='box')return 'a: rộng (trái–phải) · b: sâu (trước–sau) · h: cao';
  if(p.type==='prism')return 'h của lăng trụ = chiều dài khối ('+fmt(p.len)+' cm); đáy là tam giác.';
  return 'd: trung đoạn (đường cao mỗi mặt bên kẻ từ đỉnh chóp).';
}
function stepsOf(p,t){
  if(p.type==='box')return [
    `Kẻ lưới chữ thập lên bìa bằng thước và êke theo đúng kích thước; thêm mép dán rộng ${fmt(t)} cm ở các vùng tô xám.`,
    'Cắt theo nét liền đen; rạch nhẹ (không cắt đứt) theo nét đứt xanh để dễ gấp.',
    'Gấp 4 mặt bên Trái – Trước – Phải – Sau thành ống, dán mép dán ở mặt Sau vào mép mặt Trái.',

  const I=info(p);return [

    `Đặt liên tiếp 4 dây cung dài ${fmt(p.a)} cm trên cung, nối các điểm về tâm để được 4 tam giác cân.`,

    'Không làm mặt đáy: quét keo quanh miệng chóp rồi úp lên nóc tháp.'];

function contactHTML(G){
  const p=G.p;
  if(!p.cont.length)return '<li>Không tiếp giáp trực tiếp khối nào: gắn bằng que tre hoặc súng keo.</li>';
  const seen=new Set();
  return p.cont.filter(c=>{const k=c.face+c.other.g;if(seen.has(k))return false;seen.add(k);return true;}).map(c=>{
    const opp=c.face[0]==='+'?'-'+c.face[1]:'+'+c.face[1];
    let t=`${FACE_NAME[c.face][0].toUpperCase()+FACE_NAME[c.face].slice(1)} áp vào ${FACE_NAME[opp]} của <b>${c.other.g}</b>`;
    if(c.full)t+=` <span class="save">→ mặt khuất, có thể bỏ (tiết kiệm ${fmt(c.faceArea)} cm²)</span>`;
    return `<li>${t}</li>`;
  }).join('')+(G.n>1?'<li class="note">Mỗi chiếc còn lại ghép tương tự (đối xứng).</li>':'');
}

function assemblyHTML(M){
  const low=G=>Math.min(...G.items.map(p=>p.min[2]));
  const order=[...M.groups].sort((a,b)=>(low(a)-low(b))||(b.total-a.total));
  const placed=new Set();
  return order.map((G,i)=>{
    const nb=new Set();
    G.items.forEach(p=>p.cont.forEach(c=>{if(placed.has(c.other.g))nb.add(c.other.g);}));
    placed.add(G.g);
    let t=`<span class="no">${G.idx}</span><span><b>${G.g}</b>${G.n>1?` (× ${G.n})`:''}`;
    if(i===0)t+=' – đặt làm nền, dán cố định lên tấm bìa đế.';
    else if(nb.size)t+=` – dán áp vào ${[...nb].map(x=>`<b>${x}</b>`).join(', ')}.`;
    else t+=' – chưa chạm khối nào đã lắp: gắn bằng que tre hoặc súng keo.';
    return `<li><span class="k">Bước ${i+1}</span>${t}</span></li>`;
  }).join('');
}

function animateTo(target){
  cancelAnimationFrame(ST.raf);
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ST.e=target;drawStage();return;}

  ST.raf=requestAnimationFrame(step);
}

/* =================== Xưởng tự tạo mô hình STEM: trình dựng khối kéo thả (chạy offline) ===================
   Bản nháp giữ các khối ở dạng thô (như serializePart). Mọi thao tác kéo, đổi cỡ, xoay, đối xứng
   đi qua hộp bao (min, size) của khối; tọa độ bám lưới nên các mặt chạm nhau khít tuyệt đối,
   nhờ vậy xưởng bóc tách nhận ra mặt khuất. */
const DRAFT_KEY='stem_carton_draft_v1';
const clone=o=>JSON.parse(JSON.stringify(o));
const cleanTxt=(s,n)=>String(s==null?'':s).replace(/[<>&"]/g,'').trim().slice(0,n);
const okHex=c=>typeof c==='string'&&/^#[0-9a-f]{6}$/i.test(c);
const clampS=v=>Math.min(100,Math.max(.5,v));
const escA=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const num=(v,d)=>{v=Number(v);return isFinite(v)?v:d;};

/* Khối từ JSON, ảnh, mẫu hay bộ nhớ đều qua đây: chuẩn hóa số, màu, tên (bỏ < > & " để không chèn được HTML)
   và đưa tam giác đáy lăng trụ về dạng [[0,0],[đáy,0],[đỉnh,cao]] để hộp bao bắt đầu đúng tại o */
function cleanPart(raw){
  const p=clone(serializePart(hydratePart(raw||{})));
  p.g=cleanTxt(p.g,40)||'Khối';
  if(!okHex(p.color))p.color=C.tan;
  if(p.type==='pyr'){p.cx=num(p.cx,0);p.cy=num(p.cy,0);p.z0=num(p.z0,0);p.a=clampS(num(p.a,6));p.d=Math.max(p.a/2+.5,num(p.d,5));p.flag=!!p.flag;return p;}
  p.o=[0,1,2].map(i=>num(p.o&&p.o[i],0));
  if(p.type==='box'){p.s=[0,1,2].map(i=>clampS(num(p.s&&p.s[i],4)));if(raw&&raw.lock&&p.s[0]===p.s[1]&&p.s[1]===p.s[2])p.lock=true;}
  else{
    if(!okHex(p.cap))p.cap=p.color;
    if(p.axis!=='x')p.axis='y';
    const t=[0,1,2].map(i=>[num(p.tri&&p.tri[i]&&p.tri[i][0],0),num(p.tri&&p.tri[i]&&p.tri[i][1],0)]);
    const u0=Math.min(t[0][0],t[1][0]),base=clampS(Math.abs(t[1][0]-t[0][0])||4),ht=clampS(Math.abs(t[2][1]-t[0][1])||3);
    p.o[p.axis==='y'?0:1]+=u0;p.o[2]+=Math.min(t[0][1],t[2][1]);
    p.tri=[[0,0],[base,0],[Math.min(base,Math.max(0,t[2][0]-u0)),ht]];p.len=clampS(num(p.len,4));
  }
  p.dec=(p.dec||[]).filter(d=>Array.isArray(d)&&d.length>=7&&d.slice(0,6).every(v=>isFinite(Number(v)))).slice(0,40)
    .map(d=>d.slice(0,6).map(Number).concat(okHex(d[6])?d[6]:C.dark));
  if(p.before)p.before=p.before.filter(x=>typeof x==='string').map(x=>cleanTxt(x,40));
  return p;
}
function bboxOf(r){
  if(r.type==='box')return {min:r.o.slice(),size:r.s.slice()};
  if(r.type==='prism'){const b=r.tri[1][0],h=r.tri[2][1];return {min:r.o.slice(),size:r.axis==='y'?[b,r.len,h]:[r.len,b,h]};}
  return {min:[r.cx-r.a/2,r.cy-r.a/2,r.z0],size:[r.a,r.a,Math.sqrt(Math.max(.01,r.d*r.d-r.a*r.a/4))]};
}
/* Hình trang trí (mắt, cửa sổ…) đi theo khối: biến đổi hai góc rồi dựng lại hộp */
function mapDec(r,f){
  if(r.dec&&r.dec.length)r.dec=r.dec.map(d=>{const a=f([d[0],d[1],d[2]]),b=f([d[0]+d[3],d[1]+d[4],d[2]+d[5]]);
    return [0,1,2].map(i=>Math.min(a[i],b[i])).concat([0,1,2].map(i=>Math.abs(b[i]-a[i])),[d[6]]);});
}
function moveBy(r,d){
  if(r.type==='pyr'){r.cx+=d[0];r.cy+=d[1];r.z0+=d[2];}else r.o=r.o.map((v,i)=>v+d[i]);
  mapDec(r,p=>p.map((v,i)=>v+d[i]));return r;
}
function resizeTo(r,min,size){ // hộp & lăng trụ; chóp đổi cạnh đáy / trung đoạn trực tiếp
  const b0=bboxOf(r);
  if(r.type==='box'){r.o=min;r.s=size;}
  else{const y=r.axis==='y',base=y?size[0]:size[1],k=r.tri[1][0]?r.tri[2][0]/r.tri[1][0]:.5;
    r.tri=[[0,0],[base,0],[base*k,size[2]]];r.len=y?size[1]:size[0];r.o=min;}
  mapDec(r,p=>p.map((v,i)=>min[i]+(b0.size[i]?(v-b0.min[i])*size[i]/b0.size[i]:0)));
  return r;
}
/* Xoay 90° quanh trục đứng qua tâm c: +x thành +y */
function rot90(r,c){
  const b=bboxOf(r),f=p=>[c[0]-(p[1]-c[1]),c[1]+(p[0]-c[0]),p[2]];
  const a=f(b.min),z=f(b.min.map((v,i)=>v+b.size[i])),m=[Math.min(a[0],z[0]),Math.min(a[1],z[1]),b.min[2]];
  if(r.type==='box'){r.o=m;r.s=[b.size[1],b.size[0],b.size[2]];}
  else if(r.type==='prism'){if(r.axis==='x')r.tri[2][0]=r.tri[1][0]-r.tri[2][0];r.axis=r.axis==='y'?'x':'y';r.o=m;}
  else{r.cx=m[0]+r.a/2;r.cy=m[1]+r.a/2;}
  mapDec(r,f);return r;
}
/* Bản sao đối xứng qua mặt phẳng x = 0 (vạch vàng giữa sân) */
function mirrorX(r){
  const q=clone(r),b=bboxOf(q),dx=-(2*b.min[0]+b.size[0]);
  if(q.type==='pyr')q.cx=-q.cx;
  else{q.o[0]+=dx;if(q.type==='prism'&&q.axis==='y')q.tri[2][0]=q.tri[1][0]-q.tri[2][0];}
  mapDec(q,p=>[-p[0],p[1],p[2]]);return q;
}

/* ---------- Ảnh 2D → khối 3D ---------- */
let SAMPLE=null,SAMPLE_IMG=false,AI_CTL=null;
const PALETTE_KEYS=Object.keys(C);
const snap=v=>Math.round((Number(v)||0)*2)/2;
function colorOf(c){
  if(typeof c==='string'){if(C[c])return C[c];if(/^#[0-9a-f]{6}$/i.test(c))return c;}
  return C.tan;
}
/* Chuyển JSON Claude trả về sang định dạng khối của xưởng (kiểm tra & làm tròn 0,5 cm) */
function aiToParts(list){
  if(!Array.isArray(list))return [];
  return list.slice(0,30).map((r,i)=>{
    r=r||{};
    const g=String(r.g||r.name||('Khối '+(i+1))).slice(0,40);
    const color=colorOf(r.color);
    if(r.type==='prism'){
      const base=Math.max(1,snap(r.base)||4),height=Math.max(1,snap(r.height)||3),len=Math.max(1,snap(r.len)||4);
      const apex=Math.min(base,Math.max(0,r.apex==null?base/2:snap(r.apex)));
      return {type:'prism',g,axis:r.axis==='x'?'x':'y',tri:[[0,0],[base,0],[apex,height]],o:[snap(r.x),snap(r.y),snap(r.z)],len,color,cap:color};
    }
    if(r.type==='pyr'){
      const a=Math.max(1,snap(r.a)||6),d=Math.max(a/2+0.5,snap(r.d)||5);
      return {type:'pyr',g,cx:snap(r.cx),cy:snap(r.cy),z0:snap(r.z),a,d,color,flag:false};
    }
    return {type:'box',g,o:[snap(r.x),snap(r.y),snap(r.z)],s:[Math.max(.5,snap(r.a)||4),Math.max(.5,snap(r.b)||4),Math.max(.5,snap(r.h)||4)],color};
  });
}
/* Đặt mô hình đứng trên sàn (z = 0) và nằm giữa trục x, y */
function normalizeParts(parts){
  if(!parts.length)return parts;
  const bs=parts.map(bboxOf),mn=[0,1,2].map(i=>Math.min(...bs.map(b=>b.min[i]))),mx=[0,1,2].map(i=>Math.max(...bs.map(b=>b.min[i]+b.size[i])));
  const d=[-snap((mn[0]+mx[0])/2),-snap((mn[1]+mx[1])/2),-mn[2]];
  return parts.map(p=>moveBy(clone(p),d));
}
/* Cách 2 (không cần AI): chia ảnh thành lưới ô, mỗi mảng màu → hình hộp chữ nhật */
function pixelParts(img,opt){
  const N=opt.detail,cs=opt.cell,depth=opt.depth;
  const ratio=img.naturalWidth/img.naturalHeight;
  let cols,rows;
  if(ratio>=1){cols=N;rows=Math.max(1,Math.round(N/ratio));}else{rows=N;cols=Math.max(1,Math.round(N*ratio));}
  const S=10,cv=document.createElement('canvas');cv.width=cols*S;cv.height=rows*S;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(img,0,0,cv.width,cv.height);
  const data=ctx.getImageData(0,0,cv.width,cv.height).data;
  const w=cv.width,n=w*cv.height,lab=[],bg=new Uint8Array(n);let anyAlpha=false;
  for(let i=0;i<n;i++){if(data[i*4+3]<128){bg[i]=1;anyAlpha=true;}else lab[i]=rgb2lab([data[i*4],data[i*4+1],data[i*4+2]]);}
  const dE=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
  /* Nền = vùng loang từ mép ảnh vào và cùng màu với mép ảnh: phần trắng nằm bên trong hình
     (bụng chim cánh cụt, tường nhà) được giữ lại; so với nhiều điểm mép nên nền chuyển màu cũng bỏ được */
  if(opt.removeBg&&!anyAlpha){
    const edge=[],st=[],seen=new Uint8Array(n);
    for(let x=0;x<w;x++)st.push(x,n-w+x);for(let i=0;i<n;i+=w)st.push(i,i+w-1);
    for(let k=0;k<st.length;k+=3)edge.push(lab[st[k]]);
    while(st.length){
      const i=st.pop();if(seen[i])continue;seen[i]=1;
      if(!edge.some(e=>dE(lab[i],e)<opt.tol))continue;
      bg[i]=1;const x=i%w;
      if(x>0)st.push(i-1);if(x<w-1)st.push(i+1);if(i>=w)st.push(i-w);if(i<n-w)st.push(i+w);
    }
  }
  /* Từng điểm ảnh → màu bìa gần nhất theo Lab (độ sáng tính nửa trọng số để vùng đổ bóng không vỡ màu);
     màu chiếm dưới 3% bị gộp vào màu gần nhất còn lại */
  const pal=PALETTE_KEYS.map(k=>rgb2lab(hex2rgb(C[k])));
  const near=(q,ok)=>{let best=-1,bd=1e9;pal.forEach((p,j)=>{if(ok&&!ok[j])return;const d=Math.hypot((q[0]-p[0])/2,q[1]-p[1],q[2]-p[2]);if(d<bd){bd=d;best=j;}});return best;};
  const idx=new Int8Array(n).fill(-1),cnt=new Array(pal.length).fill(0);let fgN=0;
  for(let i=0;i<n;i++)if(!bg[i]){idx[i]=near(lab[i]);cnt[idx[i]]++;fgN++;}
  const ok=cnt.map(v=>v>=fgN*0.03);
  for(let i=0;i<n;i++)if(idx[i]>=0&&!ok[idx[i]])idx[i]=near(lab[i],ok);
  /* Mỗi ô lấy màu chiếm nhiều nhất (không lấy trung bình: ô nửa đen nửa trắng sẽ thành màu xám không có trong ảnh) */
  const grid=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const v=new Array(pal.length).fill(0);let f=0;
    for(let yy=0;yy<S;yy++)for(let xx=0;xx<S;xx++){const j=idx[(r*S+yy)*w+c*S+xx];if(j>=0){v[j]++;f++;}}
    grid[r*cols+c]=f>=S*S/2?PALETTE_KEYS[v.indexOf(Math.max(...v))]:null;
  }
  const used=new Array(rows*cols).fill(false),parts=[],W=cols*cs;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const i=r*cols+c,k=grid[i];if(!k||used[i])continue;
    let w=1;while(c+w<cols&&grid[r*cols+c+w]===k&&!used[r*cols+c+w])w++;
    let h=1;
    outer:while(r+h<rows){for(let t=0;t<w;t++){const j=(r+h)*cols+c+t;if(grid[j]!==k||used[j])break outer;}h++;}
    for(let a=0;a<h;a++)for(let b=0;b<w;b++)used[(r+a)*cols+c+b]=true;
    parts.push({type:'box',g:`Mảng ${COLOR_NAMES[k].toLowerCase()} ${w}×${h} ô`,o:[c*cs-W/2,-depth/2,(rows-r-h)*cs],s:[w*cs,depth,h*cs],color:C[k]});
  }
  return {parts,cols,rows};
}

const AI_PROMPT=`Ảnh đính kèm là hình 2D (bản vẽ tay, tranh hoặc ảnh chụp) của một vật mà học sinh lớp 6–7 muốn làm thành mô hình bằng bìa carton.
Hãy dựng vật chính trong ảnh thành mô hình 3D đơn giản, chỉ ghép từ các khối sau:
- "box": hình hộp chữ nhật hoặc hình lập phương
- "prism": lăng trụ đứng đáy tam giác (mái nhà, sừng, tai nhọn…)
- "pyr": hình chóp tứ giác đều (chỉ dùng cho mái nhọn trên nóc)

QUY TẮC
1. Hệ trục đơn vị cm: x trái→phải, y sau→trước (mặt trước của vật hướng về +y), z dưới→trên. Đáy mô hình ở z = 0.
2. Mô hình cao khoảng 15–30 cm. Mọi số là bội của 0,5.
3. Các khối KHÔNG được chồng lấn nhau. Khối nối với khối phải áp khít mặt: tọa độ mặt tiếp xúc bằng nhau tuyệt đối (ví dụ khối dưới có z + h = 10 thì khối trên có z = 10).
4. Tối đa 18 khối, ưu tiên ít khối, kích thước dễ đo cắt.
5. Bộ phận giống hệt nhau (2 chân, 2 tai…) dùng cùng tên "g" và cùng kích thước.
6. "color" chọn một trong: tan, kraft, red, blue, yellow, green, dgreen, purple, lilac, orange, cream, brown, pink, dark, white, grey, skin – gần màu trong ảnh nhất.

function aiErr(code){
  if(code==='cancelled')return 'Đã dừng phân tích.';
  if(['not_granted','sampling_disabled','capability_disabled','not_declared','images_unavailable','capability_removed'].includes(code)){
    SAMPLE=null;return 'Claude chưa được cho phép dùng trên trang này. Hãy dùng Cách 2 để dựng nhanh.';
  }
  if(code==='rate_limited')return 'Đã gọi Claude quá nhiều lần. Đợi ít phút rồi bấm lại.';
  if(code==='image_rejected')return 'Không đọc được ảnh này. Hãy chọn ảnh PNG hoặc JPG khác.';
  if(code==='refused')return 'Claude không xử lý được ảnh này. Hãy thử ảnh khác.';
  if(code==='session_expired')return 'Phiên đăng nhập đã hết. Hãy đăng nhập lại Claude.';
  if(['invalid_json','empty_parts','empty_completion'].includes(code))return 'Kết quả chưa đúng định dạng khối. Bấm phân tích lại.';
  return 'Mất kết nối khi phân tích. Bấm phân tích lại.';
}
function setImage(file){
  if(!file||!/^image\/(png|jpeg|webp|gif)$/.test(file.type)){
    DRAFT.msg={t:'err',x:'Hãy chọn tệp ảnh PNG, JPG, WebP hoặc GIF.'};renderStudio();return;
  }
  const fr=new FileReader();
  fr.onload=()=>{DRAFT.img=file;DRAFT.imgURL=fr.result;DRAFT.msg=null;renderStudio();};
  fr.onerror=()=>{DRAFT.msg={t:'err',x:'Không đọc được tệp ảnh này.'};renderStudio();};
  fr.readAsDataURL(file);
}
async function runAI(){
  if(!SAMPLE||!DRAFT.img||DRAFT.busy)return;
  AI_CTL=new AbortController();
  DRAFT.busy=true;DRAFT.msg={t:'info',x:'Claude đang phân tích ảnh và dựng khối… thường mất 30–90 giây.'};
  renderStudio();
  try{
    const res=await SAMPLE.json(AI_PROMPT,{images:[DRAFT.img],signal:AI_CTL.signal});
    const parts=normalizeParts(aiToParts(res&&res.parts));
    if(!parts.length)throw {code:'empty_parts'};
    edLoad(parts,{name:res.name?String(res.name):null,desc:res.desc?String(res.desc):null});
    DRAFT.msg={t:'ok',x:`Đã dựng ${parts.length} khối. Chạm vào từng khối trên sân để sửa, rồi bấm “Lưu & vào xưởng bóc tách”.`};
  }catch(e){
    DRAFT.msg={t:'err',x:aiErr(e&&e.code)};
  }finally{
    DRAFT.busy=false;AI_CTL=null;
    if(ST.slug==='studio')renderStudio();
  }
}
function runPixel(){

}

/* ---------- Trình dựng: góc nhìn, vẽ sân ---------- */
const VIEW_NAMES=['trước – phải','phải – sau','sau – trái','trái – trước'];
const viewName=()=>VIEW_NAMES[((Math.round(ED.ang/90)%4)+4)%4];
/* Chạy fn với góc nhìn của trình dựng (xoay ED.ang°, nghiêng ED.tilt°) rồi trả lại góc nhìn chuẩn cho thư viện và xưởng bóc tách */
function inView(fn){
  const ps=(35+ED.ang)*DEG,ph=ED.tilt*DEG,keep=[R3,U3,D3];
  R3=[Math.cos(ps),-Math.sin(ps),0];
  U3=[-Math.sin(ph)*Math.sin(ps),-Math.sin(ph)*Math.cos(ps),Math.cos(ph)];
  D3=[Math.sin(ps)*Math.cos(ph),Math.cos(ps)*Math.cos(ph),Math.sin(ph)];
  try{return fn();}finally{[R3,U3,D3]=keep;}
}
function edModel(){
  const M={slug:'draft',name:'',parts:DRAFT.parts.map((r,i)=>{const p=hydratePart(r);p.idx=i;return p;}),all:[],byUid:{},groups:[],S:0,save:0};
  if(M.parts.length)prepare(M);
  return M;
}
/* Khung nhìn ôm vòng tròn bao sân lưới và chiều cao mô hình: không đổi khi xoay nên sân không phình co lúc kéo xoay.
   Chừa trên cho thanh công cụ, dưới cho thanh thao tác */
function edFit(){
  let ext=9,top=3;
  DRAFT.parts.map(bboxOf).forEach(b=>{for(const i of [0,1])ext=Math.max(ext,Math.abs(b.min[i]),Math.abs(b.min[i]+b.size[i]));top=Math.max(top,b.min[2]+b.size[2]);});
  const E=ED.E=Math.min(60,Math.ceil(ext+3)),r=(E+2.5)*Math.SQRT2,ph=ED.tilt*DEG,y0=-r*Math.sin(ph)-(top+3)*Math.cos(ph),h=r*Math.sin(ph)-y0;
  return {x:-r*1.03,y:y0-h*.1,w:r*2.06,h:h*1.28};
}
function edIssues(M){
  const P=DRAFT.parts,bs=P.map(bboxOf),over=new Set(),pairs=[],touch=new Set();
  const meant=(a,b)=>(a.before||[]).includes(b.g)||(b.before||[]).includes(a.g); // chồng có chủ ý (ống khói xuyên mái)
  for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){
    let v=1;for(let k=0;k<3;k++)v*=Math.max(0,Math.min(bs[i].min[k]+bs[i].size[k],bs[j].min[k]+bs[j].size[k])-Math.max(bs[i].min[k],bs[j].min[k]));
    if(v<=.01)continue;
    touch.add(i);touch.add(j);
    if(!meant(P[i],P[j])){over.add(i);over.add(j);pairs.push([i,j]);}
  }
  return {over,pairs,flo:M.parts.filter(p=>p.min[2]>.01&&!p.cont.length&&!touch.has(p.idx)).map(p=>p.idx),thin:bs.map((b,i)=>Math.min(...b.size)<1?i:-1).filter(i=>i>=0)};
}
function edScene(M,upp){
  const E=ED.E,pt=q=>{const v=proj(q);return f2(v[0])+','+f2(v[1]);},D=ED.drag;
  const ln=(a,b,c)=>{const A=proj(a),B=proj(b);return `<line${c?` class="${c}"`:''} x1="${f2(A[0])}" y1="${f2(A[1])}" x2="${f2(B[0])}" y2="${f2(B[1])}"/>`;};
  let s=`<polygon class="ed-floor" points="${[[-E,-E],[E,-E],[E,E],[-E,E]].map(([x,y])=>pt([x,y,0])).join(' ')}"/><g class="ed-grid">`;
  for(let i=-E;i<=E;i++){const c=i%5?'':'m';s+=ln([i,-E,0],[i,E,0],c)+ln([-E,i,0],[E,i,0],c);}
  s+='</g>'+ln([0,-E,0],[0,E,0],'ed-axis');
  [['TRƯỚC',[0,E+1.4,0]],['SAU',[0,-E-1.4,0]],['PHẢI',[E+1.4,0,0]],['TRÁI',[-E-1.4,0,0]]].forEach(([t,q])=>{
    const v=proj(q);s+=`<text class="ed-lab" x="${f2(v[0])}" y="${f2(v[1])}" font-size="${f2(12*upp)}">${t}</text>`;});
  /* bóng chân khối đang chọn trên sàn + vạch dóng xuống sàn: giúp nhận ra khối đang lơ lửng ở độ cao nào */
  ED.sel.forEach(i=>{
    const r=DRAFT.parts[i];if(!r)return;
    const b=bboxOf(r),[x,y]=b.min,X=x+b.size[0],Y=y+b.size[1],cs=[[x,y],[X,y],[X,Y],[x,Y]];
    s+=`<polygon class="ed-foot" points="${cs.map(([a,c])=>pt([a,c,0])).join(' ')}"/>`;
    if(b.min[2]>.01)cs.forEach(([a,c])=>{s+=ln([a,c,0],[a,c,b.min[2]],'ed-drop');});
  });
  if(M.parts.length){
    const mv=D&&D.kind==='move';
    for(const it of drawOrder(sceneItems(M,0))){
      const own=it.p.decor?M.byUid[it.p.parent]:it.p,i=own.idx,on=ED.sel.includes(i);
      s+=`<g data-i="${i}" class="${on?'sel':''}${ED.iss.over.has(i)?' bad':''}"${mv&&on?' style="pointer-events:none"':''}>`;
      for(const F of it.faces){
        if(dot(F.f.n,D3)<=1e-6)continue;
        /* mặt phẳng chứa mặt khối (pháp tuyến + hằng số) để thả khối khác bám đúng vào mặt này */
        const pf=it.p.decor?(own.faces.find(f=>dot(f.n,F.f.n)>.999)||F.f):F.f;
        const pl=pf.n.map(v=>+v.toFixed(5)).join(' ')+' '+(+dot(pf.n,pf.pts[0]).toFixed(5));
        const fill=shade(F.f.color,0.58+0.42*Math.max(0,dot(F.f.n,LIGHT))),pts=F.pts2.map(q=>f2(q[0])+','+f2(q[1])).join(' ');
        s+=it.p.decor
          ?`<polygon points="${pts}" fill="${fill}" stroke="${shade(F.f.color,.75)}" stroke-width=".5" vector-effect="non-scaling-stroke" data-n="${pl}"/>`
          :`<polygon class="st" points="${pts}" fill="${fill}" stroke="#4a301c" stroke-width="1.1" stroke-linejoin="round" vector-effect="non-scaling-stroke" data-n="${pl}"/>`;
      }
      s+='</g>';
    }
  }
  return s+edHandles(upp);
}
/* Chấm trắng: kéo đổi kích thước theo từng trục (đặt ở mặt đang quay về phía người xem). Chấm vàng ↕: nâng / hạ */
function edHandles(upp){
  const D=ED.drag;
  if(ED.sel.length!==1||(D&&D.kind==='move'&&D.moved))return '';
  const r=DRAFT.parts[ED.sel[0]];if(!r)return '';
  const b=bboxOf(r),mx=b.min.map((v,i)=>v+b.size[i]),c=b.min.map((v,i)=>v+b.size[i]/2),R=10*upp;
  const hd=(q,id,k)=>{
    const P=proj(q),v=[R3[k],-U3[k]],l=Math.hypot(v[0],v[1])||1,u=[v[0]/l*R*2,v[1]/l*R*2];
    return `<g class="hdl" data-h="${id}"><line x1="${f2(P[0]-u[0])}" y1="${f2(P[1]-u[1])}" x2="${f2(P[0]+u[0])}" y2="${f2(P[1]+u[1])}"/><circle cx="${f2(P[0])}" cy="${f2(P[1])}" r="${f2(R)}"/><circle class="hit" cx="${f2(P[0])}" cy="${f2(P[1])}" r="${f2(R*2.2)}"/></g>`;
  };
  let s='';
  for(const k of [0,1]){const sg=D3[k]>=0?1:-1,q=c.slice();q[k]=sg>0?mx[k]:b.min[k];s+=hd(q,'s'+k+(sg>0?'+':'-'),k);}
  const t=c.slice();t[2]=mx[2];s+=hd(t,'s2+',2);
  const T=proj(t),L=[T[0],T[1]-R*5];
  return s+`<g class="hdl lift" data-h="lift"><line x1="${f2(T[0])}" y1="${f2(T[1])}" x2="${f2(L[0])}" y2="${f2(L[1])}"/><circle cx="${f2(L[0])}" cy="${f2(L[1])}" r="${f2(R*1.25)}"/><text x="${f2(L[0])}" y="${f2(L[1])}" font-size="${f2(R*1.5)}">↕</text><circle class="hit" cx="${f2(L[0])}" cy="${f2(L[1])}" r="${f2(R*2.2)}"/></g>`;
}
function edDraw(){
  const svg=document.getElementById('edSvg');if(!svg)return;
  ED.sel=ED.sel.filter(i=>i<DRAFT.parts.length);
  inView(()=>{
    const M=ED.M=edModel(),D=ED.drag;
    if(!ED.fit||!D||['pan','pinch','new','orbit'].includes(D.kind))ED.fit=edFit(); // khung đứng yên khi đang kéo khối
    const f=ED.fit,w=f.w/ED.zoom,h=f.h/ED.zoom,x=f.x+(f.w-w)/2+ED.pan[0],y=f.y+(f.h-h)/2+ED.pan[1];
    svg.setAttribute('viewBox',`${f2(x)} ${f2(y)} ${f2(w)} ${f2(h)}`);
    ED.upp=Math.max(w/(svg.clientWidth||600),h/(svg.clientHeight||400));
    ED.iss=edIssues(M);
    svg.innerHTML=edScene(M,ED.upp);
  });
  const lv=document.getElementById('edLive');if(lv){lv.hidden=!ED.live;lv.textContent=ED.live;}
  const em=document.getElementById('edEmpty');if(em)em.hidden=DRAFT.parts.length>0;
}

/* ---------- Trình dựng: chạm / kéo ---------- */
function svgPt(e){
  const svg=document.getElementById('edSvg'),m=svg&&svg.getScreenCTM();if(!m)return [0,0];
  const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(m.inverse());return [q.x,q.y];
}
/* Điểm 3D trên mặt phẳng n·p = c nằm dưới điểm P của màn hình (giải hệ 3 phương trình bậc nhất) */
function solvePlane(P,n,c){
  const bc=cross(U3,n),ca=cross(n,R3),ab=cross(R3,U3),det=dot(R3,bc),x=P[0],y=-P[1];
  return [0,1,2].map(i=>(x*bc[i]+y*ca[i]+c*ab[i])/det);
}
function planeOf(el){const d=el&&el.getAttribute&&el.getAttribute('data-n');if(!d)return null;const v=d.split(' ').map(Number);return {n:v.slice(0,3),c:v[3]};}
/* Mặt nằm dưới ngón tay (bỏ qua các khối đang kéo); ngoài sân trả về null, chỗ trống là mặt sàn */
function hitAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY),svg=document.getElementById('edSvg');
  if(!el||!svg||!svg.contains(el))return null;
  return planeOf(el)||{n:[0,0,1],c:0};
}
/* Đặt khối áp sát mặt được trỏ: mặt trên → xếp chồng, mặt bên → gắn sang bên. grab = điểm đang cầm trên khối */
function edPlace(hit,P,b0,grab){
  const n=hit.n,Q=solvePlane(P,n,hit.c),k=[0,1,2].reduce((a,i)=>Math.abs(n[i])>Math.abs(n[a])?i:a,0),sg=n[k]>0?1:-1;
  const st=ED.step,sn=v=>Math.round(v/st)*st,face=Math.abs(n[k])>.999?hit.c*sg:sn(Q[k]);
  const m=[0,1,2].map(t=>t===k?(sg>0?face:face-b0.size[t]):Math.max(-60,Math.min(60,sn(Q[t]-grab[t]))));
  m[2]=Math.max(0,m[2]);
  return m;
}
function edMove(D,e,hit){
  const m=edPlace(hit,svgPt(e),D.b0,D.grab),d=m.map((v,i)=>v-D.b0.min[i]);
  let lo=Infinity;D.raws0.forEach(r=>{lo=Math.min(lo,bboxOf(r).min[2]+d[2]);});if(lo<0)d[2]-=lo;
  D.raws0.forEach((r,j)=>{DRAFT.parts[j]=moveBy(clone(r),d);});
  const b=bboxOf(DRAFT.parts[D.prim]);ED.live=`x ${fmt(b.min[0])} · y ${fmt(b.min[1])} · z ${fmt(b.min[2])} cm`;
}
const axisD=(P0,P,k)=>{const v=[R3[k],-U3[k]];return ((P[0]-P0[0])*v[0]+(P[1]-P0[1])*v[1])/(v[0]*v[0]+v[1]*v[1]);};
function sizeLabel(r){

/* Đỉnh cao nhất của các khối nằm dưới vùng chân (min, size), không cao quá maxZ */
function edSupport(min,size,skip,maxZ=Infinity){

function newPart(kind){const r=SHAPES[kind].make();r.color=DRAFT.color;if(r.type==='prism')r.cap=DRAFT.color;return r;}

function edAct(k){
  const sel=ED.sel.filter(i=>DRAFT.parts[i]);if(!sel.length)return;
  const bs=sel.map(i=>bboxOf(DRAFT.parts[i])),lo=[0,1,2].map(t=>Math.min(...bs.map(b=>b.min[t]))),hi=[0,1,2].map(t=>Math.max(...bs.map(b=>b.min[t]+b.size[t])));

    const [ax,sg]=inView(()=>{const a=Math.abs(R3[0])>=Math.abs(R3[1])?0:1;return [a,R3[a]>0?1:-1];}),d=[0,0,0],n0=DRAFT.parts.length;

    DRAFT.parts.push(...add);ED.sel=add.map((_,j)=>n0+j);toast('Đã tạo khối đối xứng qua vạch vàng giữa sân.');

function edMoveSel(d){

function edField(id,val){

  const r=clone(r0),b=bboxOf(r),s=b.size.slice();
  if(/^f[XYZ]$/.test(id)){const k='XYZ'.indexOf(id[1]),d=[0,0,0];d[k]=(k===2?Math.max(0,v):Math.max(-60,Math.min(60,v)))-b.min[k];moveBy(r,d);}
  else if(/^f[ABH]$/.test(id)){v=clampS(v);if(r.lock)s.fill(v);else s['ABH'.indexOf(id[1])]=v;resizeTo(r,b.min,s);}

function edCancel(){ // ngón thứ hai chạm vào giữa lúc kéo: bỏ thao tác dở, chuyển sang thu phóng

function edDown(e){

  if(h&&ED.sel.length===1){

    ED.drag=id==='lift'?Object.assign({kind:'lift',i,P0:P,r0:clone(r)},base):Object.assign({kind:'size',i,k:+id[1],sg:id[2]==='+'?1:-1,P0:P,r0:clone(r),b0:bboxOf(r)},base);

function edPtrMove(e){

/* Kéo ngang: xoay quanh trục đứng (mô hình quay theo tay). Kéo dọc: nghiêng góc nhìn từ thấp lên gần như nhìn từ trên */

function edKey(e){
