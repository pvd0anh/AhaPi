  else if(ED.sel.length)h+=inspMany();
  else h+=`<h3 class="sth">Cách dựng</h3><ol class="tips">
    <li><b>Thêm khối:</b> chạm một hình ở thanh phía trên, hoặc kéo thả hình đó vào sân.</li>
    <li><b>Di chuyển:</b> kéo khối. Thả lên <b>mặt trên</b> khối khác để xếp chồng, thả vào <b>mặt bên</b> để gắn sang bên.</li>
    <li><b>Đổi kích thước:</b> chạm chọn khối rồi kéo <b>chấm trắng</b>; kéo <b>chấm vàng ↕</b> để nâng / hạ.</li>
    <li><b>Xoay góc nhìn:</b> giữ <b>chuột phải</b> rồi kéo (iPad: kéo bằng <b>hai ngón</b>), hoặc bấm ⟲ ⟳. Kéo chỗ trống để dời sân; chụm hai ngón hoặc Ctrl + lăn chuột để phóng to.</li>
    <li><b>Hai tai, bốn chân…:</b> làm một chiếc rồi bấm <b>Đối xứng</b> hoặc <b>Nhân bản</b>.</li></ol>
    <p class="sh">Bàn phím: mũi tên dời khối · Shift + ↑↓ nâng hạ · Delete xóa · Ctrl + Z hoàn tác · Ctrl + D nhân bản · R xoay · M đối xứng.</p>
    ${colorsHTML(DRAFT.color,'Màu cho khối mới')}
    <h3 class="sth" style="margin-top:12px">Bắt đầu từ mẫu</h3><div class="tpl">${BUILTIN_MODELS.map(M=>`<button type="button" class="btn ghost sm" data-tpl="${M.slug}">${M.name}</button>`).join('')}<button type="button" class="btn ghost sm" data-tpl="">Sân trống</button></div>`;
  h+=`</section><section class="panel"><div class="ph"><h3 class="sth">Các khối (${n})</h3>${n?'<button type="button" class="btn ghost sm" id="selAll">Chọn hết</button><button type="button" class="btn ghost sm" id="clearAll">Xóa hết</button>':''}</div>
    <div class="plist">${DRAFT.parts.map((r,i)=>`<button type="button" class="prow${ED.sel.includes(i)?' on':''}${I.over.has(i)?' bad':''}" data-pi="${i}" aria-pressed="${ED.sel.includes(i)}"><i style="background:${r.color}"></i><b>${r.g}</b><small>${sizeLabel(r)}</small></button>`).join('')||'<p class="hint" style="margin:0">Chưa có khối nào.</p>'}</div></section>
  <section class="panel">
    <details class="more" id="dImg" ${ED.open.dImg?'open':''}><summary>📷 Dựng nhanh từ ảnh</summary>${imageTabHTML()}</details>
    <details class="more" id="dJson" ${ED.open.dJson?'open':''}><summary>💾 Lưu tệp / chia sẻ mã</summary>
      <p class="hint">Tải tệp về để mang sang máy khác, hoặc sao chép mã gửi bạn.</p>
      <div class="brow"><button type="button" class="btn ghost sm" id="dlJsonBtn">⬇ Tải tệp .json</button><button type="button" class="btn ghost sm" id="openJsonBtn">⬆ Mở tệp .json</button><input type="file" id="jsonFile" accept=".json,application/json" hidden></div>
      <textarea id="jsonBox" class="txt" rows="6" spellcheck="false" aria-label="Mã JSON của mô hình">${escA(JSON.stringify({name:DRAFT.name,desc:DRAFT.desc,parts:DRAFT.parts}))}</textarea>
      <div class="brow"><button type="button" class="btn sm" id="applyJsonBtn">Mở mã đã dán</button><button type="button" class="btn ghost sm" id="copyJsonBtn">Sao chép mã</button></div>
      <div id="jsonMsg"></div>
    </details>
  </section>`;
  return h;
}
function edSetColor(c){
  DRAFT.color=c;
  if(ED.sel.length){snapshot();ED.sel.forEach(i=>{const r=DRAFT.parts[i];if(r){r.color=c;if(r.type==='prism')r.cap=c;}});}
  saveDraft();edRefresh();
}
function edApplyJSON(txt){
  const jm=document.getElementById('jsonMsg');
  try{
    const o=JSON.parse(txt);
    if(!o||!Array.isArray(o.parts)||!o.parts.length)throw new Error('thiếu danh sách khối "parts".');
    edLoad(o.parts,{name:o.name,desc:o.desc});renderStudio();toast(`Đã mở ${DRAFT.parts.length} khối. Bấm ↶ để quay lại.`);
  }catch(err){if(jm)jm.innerHTML=`<div class="alert err">Mã chưa đúng: ${escA(err.message)}</div>`;}
}
function edBindSide(){
  const side=document.getElementById('edSide');if(!side)return;
  const q=s=>side.querySelector(s),on=(s,ev,f)=>side.querySelectorAll(s).forEach(el=>el.addEventListener(ev,e=>f(el,e)));
  on('[data-step]','click',b=>{const inp=document.getElementById(b.dataset.step);edField(b.dataset.step,Number(inp.value)+Number(b.dataset.d)*ED.step);});
  on('.stp input','change',inp=>edField(inp.id,inp.value));
  on('#iName','change',inp=>{const g=cleanTxt(inp.value,40);if(!g)return edRefresh();snapshot();ED.sel.forEach(i=>{if(DRAFT.parts[i])DRAFT.parts[i].g=g;});saveDraft();edRefresh();});
  on('#iLock','change',el=>{const i=ED.sel[0],r=clone(DRAFT.parts[i]),b=bboxOf(r),v=b.size[0];snapshot();r.lock=el.checked;if(el.checked)resizeTo(r,b.min,[v,v,v]);DRAFT.parts[i]=r;saveDraft();edRefresh();});
  on('[data-apex]','click',el=>{const i=ED.sel[0],r=clone(DRAFT.parts[i]);snapshot();r.tri[2][0]=r.tri[1][0]*Number(el.dataset.apex);DRAFT.parts[i]=r;saveDraft();edRefresh();});
  on('#iFlag','change',el=>{snapshot();DRAFT.parts[ED.sel[0]].flag=el.checked;saveDraft();edRefresh();});
  on('.swatch','click',el=>edSetColor(el.dataset.c));
  on('#selNone','click',()=>{ED.sel=[];edRefresh();});
  on('#selAll','click',()=>{ED.sel=DRAFT.parts.map((_,i)=>i);edRefresh();});
  on('#clearAll','click',()=>{snapshot();DRAFT.parts=[];ED.sel=[];saveDraft();edRefresh();toast('Đã xóa hết. Bấm ↶ nếu lỡ tay.');});
  on('[data-pi]','click',(el,e)=>{const i=+el.dataset.pi;ED.sel=(ED.multi||e.shiftKey||e.ctrlKey||e.metaKey)?(ED.sel.includes(i)?ED.sel.filter(j=>j!==i):ED.sel.concat(i)):[i];edRefresh();});
  on('[data-tpl]','click',el=>{
    const M=BUILTIN_MODELS.find(m=>m.slug===el.dataset.tpl);
    edLoad(M?M.parts.map(p=>Object.assign({},p,{g:p.baseG||p.g})):[],{name:M?M.name+' của em':'Mô hình của em',desc:M?M.desc:''});
    ED.zoom=1;ED.pan=[0,0];renderStudio();toast(M?`Đã mở mẫu “${M.name}”. Bấm ↶ để quay lại.`:'Sân đã trống. Bấm ↶ nếu lỡ tay.');
  });
  on('details[id]','toggle',el=>{ED.open[el.id]=el.open;});
  /* ảnh 2D */
  const drop=q('#drop'),inp=q('#imgInput');
  if(drop){
    drop.addEventListener('click',e=>{if(e.target!==inp)inp.click();});
    drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inp.click();}});
    inp.addEventListener('change',()=>setImage(inp.files[0]));
    drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
    drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
    drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');setImage(e.dataTransfer&&e.dataTransfer.files[0]);});
  }
  on('#aiBtn','click',runAI);
  on('#stopBtn','click',()=>{if(AI_CTL)AI_CTL.abort();});
  on('#pixBtn','click',runPixel);
  ['detail','cell','depth'].forEach(k=>on('#s_'+k,'change',el=>{DRAFT[k]=Number(el.value);}));
  on('#s_bg','change',el=>{DRAFT.removeBg=el.checked;});
  /* tệp & mã JSON */
  on('#applyJsonBtn','click',()=>edApplyJSON(q('#jsonBox').value));
  on('#openJsonBtn','click',()=>q('#jsonFile').click());
  on('#jsonFile','change',el=>{const f=el.files[0];if(!f)return;const fr=new FileReader();fr.onload=()=>edApplyJSON(String(fr.result));fr.readAsText(f);});
  on('#dlJsonBtn','click',()=>{
    const base=cleanTxt(DRAFT.name,60).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'mo-hinh';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({name:DRAFT.name,desc:DRAFT.desc,parts:DRAFT.parts},null,1)],{type:'application/json'}));
    a.download=base+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  });
  on('#copyJsonBtn','click',()=>{
    const ta=q('#jsonBox'),msg=q('#jsonMsg'),done=()=>{msg.innerHTML='<div class="alert ok">Đã sao chép mã.</div>';};
    const fallback=()=>{ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}
      msg.innerHTML=ok?'<div class="alert ok">Đã sao chép mã.</div>':'<div class="alert err">Không tự sao chép được. Mã đã được bôi đen: nhấn Ctrl + C (hoặc giữ để sao chép).</div>';};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(done,fallback);else fallback();
  });
}
function edInfo(){
  const M=ED.M,n=DRAFT.parts.length,I=ED.iss,editing=DRAFT.slug&&MODELS.some(m=>m.slug===DRAFT.slug);
  let h='';
  if(n&&M&&I){
    h+=`<div class="stats">
      <div class="stat"><b>${n} khối</b><span>${M.groups.length} loại bộ phận</span></div>
      <div class="stat"><b>${fmt(M.S)} cm²</b><span>Tổng S<sub>tp</sub></span></div>
      <div class="stat"><b class="save">−${fmt(M.save)} cm²</b><span>Mặt khuất bỏ được</span></div>
      <div class="stat"><b>≈ ${fmt(needOf(M.S-M.save)/SHEET)} tấm</b><span>Bìa 50 × 70 cm (+15%)</span></div>
    </div>`;
    const nm=i=>`<b>${DRAFT.parts[i].g}</b>`,w=[];
    if(I.pairs.length)w.push(`⚠ ${I.pairs.length} cặp khối đang chồng lên nhau (viền đỏ), ví dụ ${nm(I.pairs[0][0])} và ${nm(I.pairs[0][1])}. Kéo ra để hai khối chỉ chạm mặt.`);
    if(I.flo.length)w.push(`⚠ Khối lơ lửng, không chạm khối nào: ${I.flo.slice(0,3).map(nm).join(', ')}. Bấm “Đặt xuống” hoặc kéo gắn vào khối khác.`);
    if(I.thin.length)w.push(`ℹ Có cạnh nhỏ hơn 1 cm (${I.thin.slice(0,3).map(nm).join(', ')}): khó cắt và gấp bìa.`);
    if(n>40)w.push(`ℹ Mô hình có ${n} khối – cắt dán sẽ khá lâu.`);
    if(w.length)h+=`<ul class="warn">${w.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  }
  return h+`<div class="brow savebar"><button type="button" class="btn tape" id="saveModelBtn" ${DRAFT.busy?'disabled':''}>✓ ${editing?'Lưu thay đổi':'Lưu'} &amp; vào xưởng bóc tách</button>${editing?'<button type="button" class="btn ghost" id="saveNewBtn">Lưu thành mô hình mới</button>':''}</div><div id="saveMsg"></div>`;
}
function edSave(asNew){
  if(DRAFT.busy)return;
  if(!DRAFT.parts.length){document.getElementById('saveMsg').innerHTML='<div class="alert err">Em hãy thêm ít nhất 1 khối trước khi lưu nhé!</div>';return;}
  const list=loadCustomModels(),slug=!asNew&&DRAFT.slug&&list.some(m=>m.slug===DRAFT.slug)?DRAFT.slug:'custom-'+Date.now();
  const m={slug,name:cleanTxt(DRAFT.name,60)||'Mô hình STEM tự tạo',level:0,custom:true,
    desc:cleanTxt(DRAFT.desc,200)||'Sản phẩm STEM do học sinh tự thiết kế và khai triển.',parts:DRAFT.parts.map(hydratePart)};
  const k=list.findIndex(x=>x.slug===slug);if(k>=0)list[k]=m;else list.push(m);
  saveCustomModels(list);DRAFT.slug=slug;saveDraft();rebuildAllModels();location.hash=slug;
}
function edRefresh(){
  if(ST.slug!=='studio')return;
  edDraw();
  const side=document.getElementById('edSide');if(side){side.innerHTML=edSide();edBindSide();}
  const inf=document.getElementById('edInfo');
  if(inf){
    inf.innerHTML=edInfo();
    document.getElementById('saveModelBtn').addEventListener('click',()=>edSave(false));
    const sn=document.getElementById('saveNewBtn');if(sn)sn.addEventListener('click',()=>edSave(true));
  }
  const bar=document.getElementById('edSel');
  if(bar){
    bar.hidden=!ED.sel.length;
    bar.innerHTML=[['dup','⧉','Nhân bản'],['mir','⇋','Đối xứng'],['rot','⟳','Xoay 90°'],['drop','⤓','Đặt xuống'],['del','✕','Xóa']]
      .map(([k,i,t])=>`<button type="button" class="ib${k==='del'?' del':''}" data-sb="${k}" title="${t}" aria-label="${t}">${i}<small>${t}</small></button>`).join('');
    bar.querySelectorAll('[data-sb]').forEach(b=>b.addEventListener('click',()=>edAct(b.dataset.sb)));
  }
  if(ED.palColor!==DRAFT.color){const pal=document.getElementById('edPal');if(pal){ED.palColor=DRAFT.color;pal.innerHTML=palHTML();bindPal();}}
  const set=(id,f)=>{const el=document.getElementById(id);if(el)f(el);};
  set('tUndo',el=>{el.disabled=!ED.hist.length;});
  set('tRedo',el=>{el.disabled=!ED.fut.length;});
  set('tMulti',el=>el.setAttribute('aria-pressed',ED.multi));
  set('tStep',el=>{el.innerHTML=`<small>Bước ${fmt(ED.step)} cm</small>`;});
  set('tView',el=>{el.textContent='Nhìn từ '+viewName();});
}

function renderStudio(){
  const v=document.getElementById('view');
  v.innerHTML=`
  <div class="dhead">
    <button class="back" id="backHome">← Thư viện</button>
    <h1>Tự tạo mô hình STEM của em</h1>
    <p class="desc">Thêm khối, kéo thả để xếp chồng hoặc gắn vào nhau, đổi kích thước, tô màu – rồi lưu để xem lưới khai triển. Chạy ngay trên máy, không cần mạng.</p>
  </div>
  <datalist id="nameList">${['Thân','Đầu','Chân','Bàn chân','Tay','Bàn tay','Tai','Mắt','Mũi','Mỏ','Đuôi','Cánh','Sừng','Mái','Tường','Cửa','Cửa sổ','Ống khói','Tháp','Bánh xe','Thùng xe','Đế'].map(x=>`<option value="${x}">`).join('')}</datalist>
  <div class="ed">
    <section class="panel ed-main">
      <div class="ed-pal" id="edPal" role="toolbar" aria-label="Thêm khối hình học"></div>
      <div class="ed-stage" id="edStage">
        <svg id="edSvg" class="scene ed-svg" role="application" aria-label="Sân dựng mô hình 3D. Kéo khối để di chuyển."></svg>
        <div class="ed-tools">
          <div class="grp"><button type="button" class="ib" id="tUndo" title="Hoàn tác (Ctrl + Z)" aria-label="Hoàn tác">↶</button><button type="button" class="ib" id="tRedo" title="Làm lại (Ctrl + Y)" aria-label="Làm lại">↷</button></div>
          <div class="grp"><button type="button" class="ib" id="tViewL" title="Xoay góc nhìn (hoặc giữ chuột phải rồi kéo)" aria-label="Xoay góc nhìn sang trái">⟲</button><span class="vw" id="tView" aria-live="polite"></span><button type="button" class="ib" id="tViewR" title="Xoay góc nhìn (hoặc giữ chuột phải rồi kéo)" aria-label="Xoay góc nhìn sang phải">⟳</button></div>
          <div class="grp"><button type="button" class="ib" id="tZoomOut" title="Thu nhỏ" aria-label="Thu nhỏ">−</button><button type="button" class="ib" id="tFit" title="Vừa khung" aria-label="Vừa khung">⤢</button><button type="button" class="ib" id="tZoomIn" title="Phóng to" aria-label="Phóng to">+</button></div>
          <div class="grp"><button type="button" class="ib" id="tMulti" aria-pressed="false" title="Bật để chạm chọn nhiều khối cùng lúc"><small>Chọn nhiều</small></button><button type="button" class="ib" id="tStep" title="Khoảng nhảy khi kéo khối và đổi kích thước"></button></div>
        </div>
        <div class="ed-empty" id="edEmpty">👆 Chạm một hình ở thanh trên để thêm khối đầu tiên,<br>hoặc kéo thả hình đó vào sân này.</div>
        <div class="ed-live" id="edLive" hidden></div>
        <div class="ed-sel" id="edSel" role="toolbar" aria-label="Thao tác với khối đang chọn" hidden></div>
        <div class="ed-toast" id="edToast" role="status"></div>
      </div>
      <div class="form-row" style="margin-top:14px">
        <div class="field" style="grid-column:span 2"><label for="mName">Tên mô hình</label><input id="mName" value="${escA(DRAFT.name)}" maxlength="60" placeholder="VD: Ngôi nhà mơ ước, Robot cứu hộ…"></div>
      </div>
      <div class="field" style="margin-bottom:12px"><label for="mDesc">Ý tưởng của em</label><input id="mDesc" value="${escA(DRAFT.desc)}" maxlength="200" placeholder="Mô hình làm gì, gồm những khối nào…"></div>
      <div id="edInfo"></div>
    </section>
    <aside class="ed-side" id="edSide"></aside>
  </div>`;
  const $e=id=>document.getElementById(id);
  $e('backHome').addEventListener('click',()=>{location.hash='';});
  $e('mName').addEventListener('input',e=>{DRAFT.name=e.target.value;saveDraft();});
  $e('mDesc').addEventListener('input',e=>{DRAFT.desc=e.target.value;saveDraft();});
  const stage=$e('edStage');
  stage.addEventListener('pointerdown',edDown);
  stage.addEventListener('contextmenu',e=>e.preventDefault());
  stage.addEventListener('wheel',e=>{ // lăn chuột để cuộn trang; Ctrl + lăn (hoặc chụm trên bàn di chuột) để phóng to
    if(!e.ctrlKey&&!e.metaKey)return;
    e.preventDefault();ED.zoom=Math.min(5,Math.max(.4,ED.zoom*(e.deltaY<0?1.12:1/1.12)));edDraw();
  },{passive:false});
  const view=d=>{ED.ang=(Math.round(ED.ang/90)+d)*90;ED.tilt=27;ED.pan=[0,0];ED.fit=null;edRefresh();}; // nút: về hướng chuẩn kế tiếp
  $e('tUndo').addEventListener('click',undo);
  $e('tRedo').addEventListener('click',redo);
  $e('tViewL').addEventListener('click',()=>view(-1));
  $e('tViewR').addEventListener('click',()=>view(1));
  $e('tZoomIn').addEventListener('click',()=>{ED.zoom=Math.min(5,ED.zoom*1.25);edDraw();});
  $e('tZoomOut').addEventListener('click',()=>{ED.zoom=Math.max(.4,ED.zoom/1.25);edDraw();});
  $e('tFit').addEventListener('click',()=>{ED.zoom=1;ED.pan=[0,0];ED.fit=null;edDraw();});
  $e('tMulti').addEventListener('click',()=>{ED.multi=!ED.multi;edRefresh();toast(ED.multi?'Chọn nhiều: chạm từng khối để thêm / bớt.':'Đã tắt chọn nhiều.');});
  $e('tStep').addEventListener('click',()=>{ED.step=ED.step===1?.5:1;edRefresh();toast(`Khối nhảy mỗi lần ${fmt(ED.step)} cm.`);});
  ED.palColor=null;ED.fit=null;
  edRefresh();
}

/* =================== Điều hướng & Giao diện Sáng/Tối =================== */
function route(){
  cancelAnimationFrame(ST.raf);
  const slug=(location.hash||'').replace('#','');
  window.scrollTo(0,0);
  if(slug==='studio'){ST.slug='studio';renderStudio();return;}
  const M=MODELS.find(m=>m.slug===slug);
  if(!M){ST.slug=null;renderGallery();return;}
  ST.slug=M.slug;ST.e=0;ST.focus=false;ST.sel=M.groups.reduce((a,b)=>b.total>a.total?b:a).g;
  renderDetail(M);drawStage();renderPart();
  document.querySelectorAll('tr.row').forEach(r=>r.classList.toggle('on',r.dataset.g===ST.sel));
  setTimeout(()=>{if(ST.slug===M.slug)animateTo(0.6);},350);
}

document.getElementById('homeBtn').addEventListener('click',()=>{location.hash='';});
document.getElementById('studioBtn').addEventListener('click',()=>{location.hash='studio';});
document.getElementById('themeBtn').addEventListener('click',()=>{
  const root=document.documentElement;
  const isDark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  root.setAttribute('data-theme',isDark?'light':'dark');
});

if(window.claude&&typeof window.claude.use==='function'){
  window.claude.use('sample').then(async s=>{
    SAMPLE=s;
    if(s){try{const L=await s.limits();SAMPLE_IMG=!!(L&&L.images);}catch(e){SAMPLE_IMG=false;}}
    if(ST.slug==='studio'&&!DRAFT.busy)renderStudio();
  }).catch(()=>{});
}

window.addEventListener('pointermove',edPtrMove);
window.addEventListener('pointerup',edPtrUp);
window.addEventListener('pointercancel',edPtrUp);
document.addEventListener('keydown',edKey);
window.addEventListener('resize',()=>{if(ST.slug==='studio')edDraw();});

rebuildAllModels();
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
